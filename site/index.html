/* Layout : appli de lecture « mobile d'abord ». Bandeau cyanotype daté en tête, fil de fiches où la vidéo passe avant le texte,
   jauge de preuve à 4 niveaux sur chaque fiche, lecteur audio persistant, onglets en bas (mobile) ou en haut (écran large). */
:root{
  --paper:#F2F5F9; --card:#FFFFFF; --ink:#0E1A2C; --ink-2:#425069; --ink-3:#5A6780; --rule:#D7DEE8;
  --accent:#1B4A8A; --accent-ink:#163F78; --accent-soft:#E2EAF6; --on-accent:#FFFFFF;
  --band:#123A70; --band-2:#1D4C8B; --band-ink:#F3F7FD; --band-ink-2:#BED1EE;
  --screen:#0D2240; --screen-2:#1C3F72; --screen-ink:#F2F6FC; --screen-ink-2:#A9BFDF;
  --l4:#1D6E46; --l4-soft:#DFF0E6; --l3:#136870; --l3-soft:#DCEFF0; --l2:#955500; --l2-soft:#FAEDD4; --l1:#6A47A3; --l1-soft:#ECE5F7; --l0:#4A5568; --l0-soft:#E8ECF2;
  --warn:#8F3A1C; --warn-soft:#FAE8E0;
  --scrim:rgba(9,18,32,.5);
  --shadow:0 1px 2px rgba(14,26,44,.06),0 10px 28px rgba(14,26,44,.10);
  --display:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --serif:"Spectral","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#09121F; --card:#0F1B2D; --ink:#E6ECF5; --ink-2:#AAB7CB; --ink-3:#8794AB; --rule:#213149;
  --accent:#86B6F2; --accent-ink:#A3C7F6; --accent-soft:#15294A; --on-accent:#08121F;
  --band:#0E2A54; --band-2:#1A3E74; --band-ink:#EEF4FC; --band-ink-2:#A9C2E8;
  --screen:#061428; --screen-2:#153360; --screen-ink:#EEF3FB; --screen-ink-2:#9DB4D8;
  --l4:#63C995; --l4-soft:#10301F; --l3:#58C3CB; --l3-soft:#0E2E32; --l2:#F2AA45; --l2-soft:#33240D; --l1:#B79BEB; --l1-soft:#261B3C; --l0:#B4BFD0; --l0-soft:#1B2638;
  --warn:#F2957A; --warn-soft:#3A1D13;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.42);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#09121F; --card:#0F1B2D; --ink:#E6ECF5; --ink-2:#AAB7CB; --ink-3:#8794AB; --rule:#213149;
  --accent:#86B6F2; --accent-ink:#A3C7F6; --accent-soft:#15294A; --on-accent:#08121F;
  --band:#0E2A54; --band-2:#1A3E74; --band-ink:#EEF4FC; --band-ink-2:#A9C2E8;
  --screen:#061428; --screen-2:#153360; --screen-ink:#EEF3FB; --screen-ink-2:#9DB4D8;
  --l4:#63C995; --l4-soft:#10301F; --l3:#58C3CB; --l3-soft:#0E2E32; --l2:#F2AA45; --l2-soft:#33240D; --l1:#B79BEB; --l1-soft:#261B3C; --l0:#B4BFD0; --l0-soft:#1B2638;
  --warn:#F2957A; --warn-soft:#3A1D13;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.42);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* En-tête */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:9px}
.brand{display:inline-flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand-mark{width:32px;height:32px;flex:none;color:var(--accent)}
.brand-name{display:flex;flex-direction:column;line-height:1;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand-sub{margin-top:4px;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.top-nav{display:none;gap:2px;margin-left:auto}
.top-nav button{background:none;border:0;padding:9px 12px;border-radius:10px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.top-nav button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.top-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.top-actions{margin-left:auto;display:flex;gap:8px}
.edpill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);font-family:var(--mono);font-size:12.5px;white-space:nowrap;cursor:pointer}
.edpill:hover{border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:1000px){.top-nav{display:flex}.top-actions{margin-left:6px}.tabbar{display:none!important}}
.hdr-fav[aria-current="page"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.brand{flex:none}
.top-actions{min-width:0;flex-shrink:1}
.edpill{min-width:0;overflow:hidden}
.edpill>span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:540px){.ed-n{display:none}}

/* Onglets (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:6px 1px;background:none;border:0;font-family:var(--display);font-weight:600;font-size:11px;color:var(--ink-3);cursor:pointer}
.tabbar{grid-template-columns:1.1fr .85fr .8fr .85fr 1fr 1.05fr}
.tabbar button span{white-space:nowrap}
@media (max-width:380px){.tabbar button{font-size:10px}}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}
.tabbar button[aria-current="page"] .ic{stroke-width:2.3}
main{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
body.has-mini main{padding-bottom:calc(144px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){main{padding-bottom:48px}body.has-mini main{padding-bottom:112px}}

/* Bandeau de l'édition */
.masthead{position:relative;overflow:hidden;isolation:isolate;background:var(--band);color:var(--band-ink)}
.masthead::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.6;background:repeating-radial-gradient(circle at 96% -14%,transparent 0 30px,var(--band-2) 30px 31.5px);-webkit-mask-image:linear-gradient(to left,#000,transparent 72%);mask-image:linear-gradient(to left,#000,transparent 72%)}
.mh-in{position:relative;z-index:1;padding-block:24px 28px}
.mh-kicker{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-ink-2)}
.mh-date{display:flex;align-items:flex-end;gap:14px;margin:10px 0 16px;font-weight:inherit;font-size:inherit}
.mh-day{font-family:var(--display);font-weight:800;font-size:clamp(78px,19vw,138px);line-height:.8;letter-spacing:-.05em}
.mh-rest{display:flex;flex-direction:column;gap:5px;padding-bottom:4px;font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,30px);line-height:1}
.mh-wd{font-weight:600;color:var(--band-ink-2);text-transform:capitalize}
.mh-title{margin:0 0 10px;max-width:32ch;font-family:var(--display);font-weight:700;font-size:clamp(20px,4.8vw,27px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.mh-intro{margin:0 0 16px;max-width:64ch;font-size:17px;line-height:1.55;color:var(--band-ink)}
.mh-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12.5px;color:var(--band-ink-2)}
.mh-stats b{font-weight:500;color:var(--band-ink)}
.mh-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn-band{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--band-ink);background:var(--band-ink);color:var(--band);font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer}
.btn-band.ghost{background:transparent;color:var(--band-ink);border-color:var(--band-ink-2)}
.btn-band:hover{border-color:var(--band-ink)}
.oldbar{position:relative;z-index:2;background:var(--band-2)}
.oldbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;font-family:var(--display);font-weight:600;font-size:13.5px}
.skel{opacity:.35}

/* Sections */
.section{padding-block:30px 6px;scroll-margin-top:68px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:14px}
.sec-title{margin:0;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.015em;text-wrap:balance}
.sec-sub{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sub-h{margin:26px 0 10px;font-family:var(--display);font-weight:700;font-size:16px}
.sub-h.small{margin:16px 0 8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lede{margin:0 0 16px;max-width:68ch;color:var(--ink-2)}
.kicker{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:600;font-size:14px;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;border-radius:10px;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{color:var(--on-accent)}
.btn.ghost{background:transparent}
.iconbtn{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.iconbtn.lg{width:52px;height:52px;border-radius:16px}
.fav[aria-pressed="true"]{color:var(--l2);border-color:var(--l2)}
.fav[aria-pressed="true"] .ic path{fill:currentColor}
.linklike{all:unset;cursor:pointer}
.linklike:hover{color:var(--accent-ink)}
.linklike:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:4px}

/* Filtres */
.filters{display:grid;gap:10px;margin-bottom:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -2px;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.45;cursor:default}
.chip.sm{min-height:32px;padding:0 10px}
.chip.ghost{background:transparent}
.chip-n{font-family:var(--mono);font-weight:500;font-size:11.5px;opacity:.8}
.lvchip.lv4[aria-pressed="true"]{background:var(--l4);border-color:var(--l4);color:var(--card)}
.lvchip.lv3[aria-pressed="true"]{background:var(--l3);border-color:var(--l3);color:var(--card)}
.lvchip.lv2[aria-pressed="true"]{background:var(--l2);border-color:var(--l2);color:var(--card)}
.lvchip.lv1[aria-pressed="true"]{background:var(--l1);border-color:var(--l1);color:var(--card)}
.search{display:flex;align-items:center;gap:8px;max-width:520px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:16px}

/* Jauge de preuve */
.ev{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap}
.ev.big{padding:6px 12px 6px 10px;font-size:14px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.bars i{display:block;width:3.5px;border-radius:1px;background:currentColor;opacity:.25}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}
.bars i.on{opacity:1}
.lv4{color:var(--l4);background:var(--l4-soft)}
.lv3{color:var(--l3);background:var(--l3-soft)}
.lv2{color:var(--l2);background:var(--l2-soft)}
.lv1{color:var(--l1);background:var(--l1-soft)}
.lv0{color:var(--l0);background:var(--l0-soft)}
.ev-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ev-type{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.lv4{background:var(--l4)}.dot.lv3{background:var(--l3)}.dot.lv2{background:var(--l2)}.dot.lv1{background:var(--l1)}.dot.lv0{background:var(--l0)}

/* Fiches du fil */
.feed{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.feed{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:18px}
.card-media{display:grid;gap:8px;padding:10px 10px 0}
.more-v{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:12.5px;cursor:pointer}
.novid{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 10px 0;padding:9px 12px;border-radius:12px;background:var(--paper);color:var(--ink-3);font-family:var(--display);font-weight:600;font-size:12.5px}
.novid a{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);text-decoration:none}
.card-body{display:grid;gap:9px;min-width:0;padding:14px 16px 16px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.02em;color:var(--accent-ink)}
.new{padding:1px 6px;border:1px solid var(--accent);border-radius:6px;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.card-title{margin:0;font-family:var(--serif);font-weight:700;font-size:20.5px;line-height:1.22;letter-spacing:-.005em;text-wrap:balance}
.dek{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.card-actions .fav{margin-left:auto}
.empty{grid-column:1/-1;display:grid;justify-items:center;gap:8px;padding:28px 16px;text-align:center;border:1px dashed var(--rule);border-radius:16px;color:var(--ink-2)}
.empty p{margin:0}

/* Vidéos */
.vt{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px}
.vt:hover{border-color:var(--accent)}
.vt:hover .vt-play{transform:scale(1.06)}
.vt-screen{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;overflow:hidden;color:var(--screen-ink);background:radial-gradient(130% 100% at 18% 0%,var(--screen-2),var(--screen) 72%)}
.vt-screen::before{content:"";position:absolute;inset:0;opacity:.28;background:repeating-linear-gradient(0deg,transparent 0 3px,var(--screen-2) 3px 4px)}
.vt-play{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--screen-ink);color:var(--screen);transition:transform .15s ease}
.vt-play .ic{transform:translateX(2px)}
.vt-badges{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px}
.vb{padding:4px 7px;border:1px solid var(--screen-ink-2);border-radius:6px;font-family:var(--mono);font-size:11px;line-height:1;color:var(--screen-ink)}
.vt-body{display:grid;gap:4px;min-width:0;padding:10px 12px 12px}
.vt-kind{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vt-kind.k-officielle{color:var(--l4)}
.vt-kind.k-tierce{color:var(--l2)}
.vt-title{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.vt-note{font-size:13.5px;line-height:1.4;color:var(--ink-3)}
.vt.row{flex-direction:row;align-items:stretch;border-radius:12px}
.vt.row .vt-screen{flex:none;width:36%;max-width:168px;min-height:88px;aspect-ratio:auto}
.vt.row .vt-play{width:38px;height:38px}
.vt.row .vt-badges{left:6px;top:6px;right:6px}
.vt.row .vt-badges .vb+.vb{display:none}
.vt.row .vt-body{align-content:center;padding:8px 12px}
.vt.row .vt-title{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vt.row .vt-note{display:none}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vsearch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-3)}

/* À la une */
.topcard{display:grid;grid-template-columns:1fr;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:20px}
.top-media{padding:12px 12px 0}
.top-media .vt{border:0;background:transparent}
.top-media .vt-screen{border-radius:12px}
.top-media .vt-play{width:74px;height:74px}
.top-media .vt-body{padding:10px 4px 0}
.top-body{display:grid;gap:10px;min-width:0;padding:16px 18px 18px}
.top-title{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(24px,5.4vw,32px);line-height:1.15;text-wrap:balance}
@media (min-width:900px){.topcard{grid-template-columns:1.15fr 1fr}.top-media{padding:14px}.top-body{align-content:center;padding:22px 24px 22px 8px}}

/* Résumé par catégorie */
.catgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.catgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catcard{display:grid;align-content:start;gap:8px;min-width:0;padding:14px 16px;text-align:left;border-radius:16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.catcard:hover{border-color:var(--accent)}
.cc-head{display:flex;align-items:center;gap:8px;color:var(--accent-ink)}
.cc-label{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.cc-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.cc-sum{font-size:15px;line-height:1.5;color:var(--ink-2)}
.cc-dots{display:flex;gap:5px}

/* Concept, agenda, méthode */
.concept,.method{padding:20px 18px;border-radius:20px;border:1px solid var(--rule);background:var(--card)}
.concept-title{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:clamp(22px,4.6vw,28px);line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.concept-grid{display:grid;gap:18px}
@media (min-width:900px){.concept-grid{grid-template-columns:1.4fr 1fr;align-items:start}}
.concept-text p{margin:0 0 12px;max-width:66ch}
.concept-media{display:grid;gap:12px}
.agenda{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.agenda li{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.ag-date{padding-top:3px;font-family:var(--mono);font-size:12.5px;color:var(--accent-ink)}
.ag-body{display:grid;gap:2px;min-width:0}
.ag-body b{font-weight:600}
.ag-body span{font-size:15px;color:var(--ink-2)}
.ag-src{padding:4px;color:var(--ink-3)}
.levels{display:grid;gap:10px;margin:0 0 18px;padding:0;list-style:none}
.lvrow{display:grid;grid-template-columns:136px 1fr;align-items:start;gap:12px}
.lvrow .ev{justify-self:start}
.lvrow>span:last-child{font-size:15.5px;color:var(--ink-2)}
@media (max-width:480px){.lvrow{grid-template-columns:1fr;gap:4px}}
.method-cols{display:grid;gap:16px}
@media (min-width:760px){.method-cols{grid-template-columns:1fr 1fr}}
.method h3{margin:0 0 8px;font-family:var(--display);font-size:15px}
.ticks{display:grid;gap:6px;margin:0;padding-left:18px;font-size:15.5px;color:var(--ink-2)}
.foot{padding-block:28px 12px;font-size:14px;color:var(--ink-3)}
.foot p{max-width:76ch;margin:0 0 8px}
.foot-meta{font-family:var(--mono);font-size:12px}

/* Fiche détaillée */
.sheet-backdrop{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-end;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:800px;height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{position:sticky;top:0;z-index:3;padding-top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--rule)}
.sheet-head .in{display:flex;align-items:center;gap:10px;min-height:58px}
.sheet-date{margin-right:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sheet-h{margin:0 auto 0 0;font-family:var(--display);font-size:18px}
@media (min-width:860px){.sheet-backdrop{align-items:center;padding:24px}.sheet{height:auto;max-height:100%;border-radius:22px;border:1px solid var(--rule);box-shadow:var(--shadow)}.sheet-head{padding-top:0}.pad{padding-left:28px;padding-right:28px}}
.sheet-body{padding-top:14px}
.detail{padding-top:18px}
.detail p{max-width:68ch}
.d-title{margin:0 0 12px;font-family:var(--serif);font-weight:700;font-size:clamp(25px,6vw,34px);line-height:1.14;letter-spacing:-.01em;text-wrap:balance}
.d-sec{margin-top:24px;scroll-margin-top:70px}
.d-sec p{margin:0 0 12px}
.d-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.d-dek{margin:22px 0 0;font-size:19px;line-height:1.5}
.figure{margin:18px 0 0}
/* Comprendre */
.n-intro{margin:0 0 14px;max-width:720px;color:var(--ink-2);font-size:16px}
.lvl-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.lvl-legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.lvl-b{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:12px;flex:none}
.lvl-b.l2{background:var(--l3-soft);color:var(--l3)} .lvl-b.l3{background:var(--l1-soft);color:var(--l1)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0 24px}
.ncard{all:unset;box-sizing:border-box;display:grid;gap:4px;padding:14px 16px;border-radius:16px;border:1px solid var(--rule);background:var(--card);cursor:pointer}
.ncard:hover,.ncard:focus-visible{border-color:var(--accent)}
.ncard b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.ncard span{font-size:14.5px;color:var(--ink-2)}
.n-dom{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:18px}
.n-dom small{display:block;font-weight:500;font-size:13px;color:var(--ink-3)}
.schema{margin:18px 0 0;padding:12px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
.schema svg{display:block;width:100%;height:auto;max-height:360px}
.schema figcaption{margin-top:8px;font-size:13.5px;color:var(--ink-3)}
.schema .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.schema .lt{fill:none;stroke:var(--ink-3);stroke-width:1.2}
.schema .ac{fill:none;stroke:var(--accent);stroke-width:2.4}
.schema .dash{stroke-dasharray:5 4}
.schema .sf{fill:var(--accent-soft)}
.schema .c0{fill:var(--l0)} .schema .c1{fill:var(--accent)} .schema .c2{fill:var(--l2)} .schema .c3{fill:var(--l3)} .schema .c4{fill:var(--l1)}
.schema .mk{fill:var(--ink)} .schema .mka{fill:var(--accent)}
.schema text{font-family:var(--display);font-size:12px;fill:var(--ink-2)}
.schema .tb{font-weight:700;font-size:13px;fill:var(--ink)}
.schema .ts{font-size:10.5px}
.schema .tw{fill:var(--on-accent);font-weight:700;font-size:13px}
.lvl{margin-top:24px;padding:16px;border-radius:16px;border:1px solid var(--rule);background:var(--card)}
.lvl .d-h{margin-bottom:12px}
.lvl1{border-color:var(--accent-soft);background:var(--accent-soft)}
.lvl1 p{font-size:17.5px;line-height:1.55}
.lvl1 .lvl-b{background:var(--card)}
details.lvl summary{cursor:pointer;list-style:none}
details.lvl summary::-webkit-details-marker{display:none}
details.lvl summary .more-hint{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--ink-3)}
details.lvl[open] summary .more-hint{display:none}
.dyk{margin-top:16px;padding:14px 16px;border-radius:14px;border-left:4px solid var(--l2);background:var(--l2-soft);color:var(--ink)}
.dyk b{display:block;margin-bottom:4px;font-family:var(--display)}
.formulas{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.formulas li{display:grid;gap:3px}
.formulas code{justify-self:start;padding:6px 10px;border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:15px}
.formulas span{font-size:13.5px;color:var(--ink-3)}
.exp ol{margin:8px 0 0;padding-left:22px}
.exp li{margin:6px 0}
.n-related{display:flex;flex-wrap:wrap;gap:8px}
.vlist{display:grid;gap:10px}
.figure img{display:block;width:100%;height:auto;border-radius:14px;background:var(--paper)}
.figure figcaption{margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.card-img{position:relative;display:block;margin:10px 10px 0;border-radius:12px;overflow:hidden;background:var(--paper)}
.img-tag{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:rgba(9,18,32,.72);color:#fff;font-family:var(--display);font-weight:600;font-size:11px}
.card-img img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.d-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:18px 0 0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink-2);padding:8px 14px;min-height:38px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tsize{display:inline-flex;gap:6px;margin-left:auto}
.tsize button{min-width:42px;min-height:38px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}
.detail[data-dmode="sum"] .d-long{display:none}
.detail[data-dmode="long"] .d-sum{display:none}
.d-long p{font-family:var(--serif)}
.keypts{margin:0 0 16px;padding:12px 16px 12px 34px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.keypts li{margin:4px 0}
.d-note{font-size:13px;color:var(--ink-3)}
html[data-tsize="1"]{--ts:1.12} html[data-tsize="2"]{--ts:1.26} html[data-tsize="3"]{--ts:1.42}
.detail .d-sec p,.detail .keypts li,.detail .d-dek{font-size:calc(1em * var(--ts,1))}
.status{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.reviewed{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:12px;color:var(--l4)}
.reviewed.no{color:var(--l2)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.num{display:grid;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.num b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.num span{font-size:14px;line-height:1.35;color:var(--ink-2)}
.why{padding:14px 16px;border-radius:14px;background:var(--accent-soft)}
.why .d-h{color:var(--accent-ink)}
.why p{margin:0}
.proof-card{display:grid;gap:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.proof-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.proof-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.proof-desc{margin:0;font-size:15px;color:var(--ink-2)}
.proof-note{margin:0;font-size:15.5px}
.su{display:grid;gap:12px;margin-top:12px}
@media (min-width:640px){.su{grid-template-columns:1fr 1fr}}
.su>div{padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.su h4{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-family:var(--display);font-size:14px}
.su .ok h4{color:var(--l4)}

/* Listes (catégories, favoris, archives) */

.vgroup{display:grid;gap:10px}
.vg-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

/* Écouter */

.player{display:grid;gap:12px;padding:20px 18px;border-radius:20px;background:var(--band);color:var(--band-ink)}

@media (min-width:420px){.pl-ctrls{gap:16px}}
/* Rubrique Politique & monde : bordeaux (les variables de couleur sont redéfinies sur la zone concernée) */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-sec="pol"]{--accent:#F29AA8;--accent-ink:#F5B4BF;--accent-soft:#3B1720;--on-accent:#1A0709;--band:#4A1520;--band-2:#62202D;--band-ink:#FCEFF2;--band-ink-2:#E7B3BE}}
:root[data-theme="dark"] [data-sec="pol"]{--accent:#F29AA8;--accent-ink:#F5B4BF;--accent-soft:#3B1720;--on-accent:#1A0709;--band:#4A1520;--band-2:#62202D;--band-ink:#FCEFF2;--band-ink-2:#E7B3BE}

/* Mon point du matin */

.mt-h{margin:0;font-family:var(--display);font-size:19px}

.mt-chips{display:flex;flex-wrap:wrap;gap:8px}

.mt-actions .btn.on{background:var(--l4);border-color:var(--l4);color:#fff}

/* Itinéraire et réglages du matin */

.iti-res p{margin:0;font-size:15px;line-height:1.45}
.iti-other summary{cursor:pointer;color:var(--accent-ink);font-weight:700;margin:6px 0}

.rg-lieux li span{flex:1;min-width:0;display:grid}

.pbar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:8px}

.numb{flex:none;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;line-height:1}

.som{display:grid;gap:8px;margin:0;padding:0;list-style:none}

/* Commande vocale : bouton micro flottant, bulle de dialogue, carte d'aide */
.mic-fab{position:fixed;z-index:56;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(64px + 14px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;width:60px;height:60px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);cursor:pointer}

.mic-fab[aria-pressed="true"]{animation:micpulse 1.2s ease-in-out infinite}

.vbub{position:fixed;z-index:57;right:max(14px,env(safe-area-inset-right,0px));left:max(14px,env(safe-area-inset-left,0px));bottom:calc(64px + 84px + env(safe-area-inset-bottom,0px));max-width:420px;margin-left:auto;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:600;font-size:15px;line-height:1.4;box-shadow:var(--shadow)}

@media (min-width:1000px){.mic-fab,body.has-mini .mic-fab,html.locked .mic-fab,html.locked body.has-mini .mic-fab{right:auto;left:24px;bottom:24px}.vbub,body.has-mini .vbub,html.locked .vbub,html.locked body.has-mini .vbub{right:auto;left:24px;bottom:96px;margin-left:0}}

/* Installation : la Matinale est une application web installable (icône sur l'écran d'accueil, plein écran, hors ligne). */
let installEvt = null;
function isInstalled(){ try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } }
function installShort(){
  if (IS_IOS) return "Dans Safari : bouton Partager, puis « Sur l'écran d'accueil ».";
  if (installEvt) return "Un seul geste : elle s'ouvrira ensuite comme une application, en plein écran.";
  return "Dans Chrome : menu ⋮, puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».";
}
function installInner(){
  if (isInstalled() || (!IS_MOBILE && !installEvt)) return '';
  const st = LS.get('mds.install', null);
  if (st === 'done' || (typeof st === 'number' && st > Date.now())) return '';
  return '<section class="section" style="padding-top:16px"><div class="wrap"><div class="install"><span class="install-ic">' + icon('phone', 22) + '</span><div class="install-main">' +
    "<b>Mets la Matinale sur ton écran d'accueil</b><span>" + esc(installShort()) + '</span>' +
    '<div class="card-actions">' + (installEvt
      ? '<button class="btn sm primary" data-action="install-now">' + icon('phone', 15) + ' Installer</button>'
      : '<button class="btn sm primary" data-action="install-help">Voir comment faire</button>') +
    "<button class=\"btn sm ghost\" data-action=\"install-done\">C'est fait</button>" +
    '<button class="btn sm ghost" data-action="install-later">Plus tard</button></div></div></div></div></section>';
}
function installBannerHTML(){ return '<div id="install-slot">' + installInner() + '</div>'; }
function refreshInstall(){ const el = $('#install-slot'); if (el) el.innerHTML = installInner(); }
function installNow(){
  const e = installEvt; if (!e){ openInstallHelp(); return; }
  installEvt = null;
  try {
    e.prompt();
    Promise.resolve(e.userChoice).then(c => {
      if (c && c.outcome === 'accepted'){ LS.set('mds.install', 'done'); closeSheet(); toast("C'est installé : la Matinale est sur ton écran d'accueil."); }
      refreshInstall();
    }).catch(() => refreshInstall());
  } catch (err) { openInstallHelp(); }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; refreshInstall(); });

/* ---------- Francophonie ---------- */
const shorten = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; };
const hlVideos = h => arr(h && h.videos).filter(v => v && isHttp(v.url));
function frHighlights(ed){ return arr(ed && ed.francophonie && ed.francophonie.highlights).filter(h => h && h.id && h.title); }
function frVideos(ed){
  const out = [], seen = new Set();
  const add = (v, extra) => { if (!v || !isHttp(v.url) || !isFr(v) || seen.has(v.url)) return; seen.add(v.url); out.push(Object.assign({ v }, extra || {})); };
  if (!ed) return out;
  frHighlights(ed).forEach(h => hlVideos(h).forEach(v => add(v, { hl: h.id, hlTitle: h.title })));
  arr(ed.francophonie && ed.francophonie.videos).forEach(v => add(v, { key: v.item ? ed.date + ':' + v.item : null }));
  ed.items.forEach(it => it.videos.forEach(v => add(v, { key: it.key })));
  return out;
}
function frStripHTML(ed){
  const hls = frHighlights(ed), vids = frVideos(ed);
  if (!hls.length && !vids.length) return '';
  return '<section class="section"><div class="wrap"><div class="sec-head"><h2 class="sec-title">La science en français</h2><button class="btn sm" data-action="tab" data-tab="franco">' + icon('bubble', 16) + ' Section Francophonie</button></div>' +
    (hls.length ? '<div class="fr-hl-row">' + hls.map(h => '<button class="fr-mini" data-action="goto-hl" data-hl="' + esc(h.id) + '"><span class="kicker">' + esc(h.kicker || 'Francophonie') + '</span><b>' + t(h.title) + '</b></button>').join('') + '</div>' : '') +
    (vids.length ? '<div class="hscroll" role="list" aria-label="Vidéos en français">' + vids.map(x => '<div role="listitem">' + vtileHTML(x.v) + '</div>').join('') + '</div>' : '') +
    '</div></section>';
}
function hlHTML(h){
  const vids = hlVideos(h), srcs = arr(h.sources).filter(s => s && isHttp(s.url)), facts = arr(h.facts).filter(x => x && x.v);
  return '<article class="hl" id="hl-' + esc(h.id) + '"><p class="kicker">' + esc(h.kicker || 'Francophonie') + '</p><h3 class="hl-title">' + t(h.title) + '</h3>' +
    (vids.length ? '<div class="vgrid">' + vids.map(v => vtileHTML(v)).join('') + '</div>' : '') +
    '<div class="hl-text">' + arr(h.text).map(p => '<p>' + t(p) + '</p>').join('') + '</div>' +
    (facts.length ? '<div class="nums">' + facts.map(x => '<div class="num"><b>' + t(x.v) + '</b><span>' + t(x.l || '') + '</span></div>').join('') + '</div>' : '') +
    (h.audio ? '<div class="card-actions"><button class="btn sm ghost" data-action="load" data-mode="hl" data-hl="' + esc(h.id) + '">' + icon('headphones', 16) + ' Écouter</button></div>' : '') +
    (srcs.length ? '<ul class="srcs compact">' + srcs.map(srcLi).join('') + '</ul>' : '') + '</article>';
}
function initials(n){
  const w = String(n || '').replace(/[^0-9A-Za-zÀ-ÖØ-öø-ÿŒœ\s'’-]/g, ' ').split(/[\s'’-]+/).filter(x => x && !/^(le|la|les|l|de|du|des|d|et|dr)$/i.test(x));
  if (!w.length) return '·';
  return (w[0].charAt(0) + (w[1] ? w[1].charAt(0) : w[0].charAt(1))).toUpperCase();
}
function chHTML(c, G){

/* ---------- Podcast : construction des émissions ---------- */
function itemFullAudio(it){
  if (it.pol){
    const pp = [it.title + '.', it.dek].concat(arr(it.detail).length ? arr(it.detail) : arr(it.body));
    if (it.why) pp.push("L'enjeu : " + it.why);
    if (arr(it.sure).length) pp.push('Les faits : ' + arr(it.sure).join(' '));
    if (arr(it.positions).length) pp.push('Les positions : ' + arr(it.positions).join(' '));
    if (arr(it.next).length) pp.push('À suivre : ' + arr(it.next).join(' '));
    return pp.filter(Boolean).join(' ');
  }

function fileSegment(mode, opt){
  opt = opt || {};

    const r = S.nAudio && S.nAudio.notions && S.nAudio.notions[opt.id], n = notionById(opt.id);
    if (!r || !r.src || /^[a-z]+:/i.test(r.src) || !(r.duration > 0) || !n) return null;
    return { src: r.src, start: 0, end: r.duration, chapters: [{ title: n.title, text: r.text || notionAudio(n), start: 0, end: r.duration }] };
  }
  if (mode === 'pflash' || (mode === 'item' && /^P/.test(String(opt.key || '')))){   /* rubrique Politique & monde */
    const P = S.pol && S.pol.ed, PA = S.pol && S.pol.audio;
    if (!P || !PA || PA.date !== P.date) return null;
    const pk = (rec, chs) => { chs = arr(chs).filter(c => c && typeof c.start === 'number' && typeof c.end === 'number' && c.end > c.start); if (!rec || !rec.src || /^[a-z]+:/i.test(rec.src) || !chs.length) return null; return { src: rec.src, start: chs[0].start, end: chs[chs.length - 1].end, chapters: chs.map(c => ({ key: c.key, title: c.title, text: c.text || c.title, start: c.start, end: c.end })) }; };

    const one = PA.items && PA.items[String(opt.key).split(':').slice(1).join(':')];
    return one ? pk(one, one.chapters) : null;
  }
  const A = S.audio, ed = S.edition;
  if (mode === 'item'){   /* une fiche d'un jour précédent : sa liste est gardée dans le téléphone */
    const day = String(opt.key || '').split(':')[0], id = String(opt.key || '').split(':').slice(1).join(':');
    const AA = (A && A.date === day) ? A : (S.audioByDate || {})[day];
    const one = AA && AA.items && AA.items[id];
    if (one && one.src && !/^[a-z]+:/i.test(one.src) && arr(one.chapters).length){
      const chs = arr(one.chapters).filter(c => c && typeof c.start === 'number' && typeof c.end === 'number' && c.end > c.start);
      if (chs.length) return { src: one.src, start: chs[0].start, end: chs[chs.length - 1].end, chapters: chs.map(c => ({ key: c.key, title: c.title, text: c.text || c.title, start: c.start, end: c.end })) };
    }
  }
  if (!A || !ed || A.date !== ed.date) return null;
  const pick = (rec, chs) => {
    chs = arr(chs).filter(c => c && typeof c.start === 'number' && typeof c.end === 'number' && c.end > c.start);
    if (!rec || !rec.src || /^[a-z]+:/i.test(rec.src) || !chs.length) return null;
    return { src: rec.src, start: chs[0].start, end: chs[chs.length - 1].end, chapters: chs.map(c => ({ key: c.key, title: c.title, text: c.text || c.title, start: c.start, end: c.end })) };
  };
  const fresh = seg => { if (seg && A.generatedAt && /^audio\/(flash|full)\.mp3$/.test(seg.src)) seg.src += '?v=' + encodeURIComponent(A.generatedAt); return seg; };
  if (mode === 'flash') return A.flash ? fresh(pick(A.flash, A.flash.chapters)) : null;
  if (!A.full) return null;
  const fc = arr(A.full.chapters);
  if (mode === 'full') return fresh(pick(A.full, fc));
  if (mode === 'item'){
    const id = String(opt.key || '').split(':').slice(1).join(':');

  if (mode === 'franco' || mode === 'hl') return pick(A.full, fc.filter(c => c.title === 'Francophonie'));
  return null;
}

/* ---------- Questions à Claude ---------- */
function inline(s){ return esc(fr(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function mdLite(s){
  const lines = String(s || '').split(/\r?\n/); let html = '', inList = false, para = [];
  const flush = () => { if (para.length){ html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  lines.forEach(raw => {
    const l = raw.trim();
    if (/^[-*•]\s+/.test(l)){ flush(); if (!inList){ html += '<ul>'; inList = true; } html += '<li>' + inline(l.replace(/^[-*•]\s+/, '')) + '</li>'; }
    else if (!l){ flush(); if (inList){ html += '</ul>'; inList = false; } }
    else { if (inList){ html += '</ul>'; inList = false; } para.push(l.replace(/^#+\s*/, '')); }
  });
  flush(); if (inList) html += '</ul>';
  return html;
}
async function ask(q){
  const it = itemByKey(S.detailKey); const out = $('#ask-out');
  if (!S.sample || !it || !out || !q) return;
  if (S.askCtl){ try { S.askCtl.abort(); } catch (e) {} }
  const ctl = new AbortController(); S.askCtl = ctl;
  out.hidden = false; out.innerHTML = '<p class="muted">Claude réfléchit…</p>';
  const ev = it.evidence || {};
  const fiche = { titre:it.title, chapo:it.dek, resume:it.body, pourquoi_c_est_important:it.why || null, ce_qui_est_etabli:it.sure, ce_qui_reste_a_prouver:it.unsure, chiffres_cles:it.numbers,
    niveau_de_preuve:LEVELS[lvl(it)].name, type_d_etude:ev.type || null, statut:ev.status || null, note_sur_la_preuve:ev.note || null,
    revue:it.journal || null, date:dateLabel(it), institutions:it.who || null, conflits_d_interets:it.coi || null, sujet_de_sante:!!it.health };
  const prompt = "Tu es le rédacteur scientifique de l'application « Matinale des Sciences ». Réponds en français, en 180 mots maximum, de façon claire et exacte, sans jargon inutile. Utilise des paragraphes courts, et une liste à puces seulement si elle aide.\n\n" +
    "Règles :\n- Appuie-toi d'abord sur la fiche ci-dessous. Tu peux ajouter des connaissances scientifiques générales bien établies, mais n'invente aucun chiffre, aucune étude, aucun nom et aucune source.\n" +
    "- Si la fiche ne permet pas de répondre, dis-le simplement.\n- Respecte le niveau de preuve indiqué : ne présente jamais un résultat préliminaire comme une certitude, et ne confonds pas corrélation et cause.\n" +
    "- Pour un sujet de santé, ne donne aucun conseil médical personnel et rappelle de consulter un professionnel si la question le justifie.\n\n" +
    "FICHE (JSON) :\n" + JSON.stringify(fiche) + "\n\nQUESTION : " + q;
  try {
    const r = await S.sample(prompt, { signal: ctl.signal, onText: u => { if (S.askCtl === ctl) out.innerHTML = mdLite(u.text); } });
    if (S.askCtl !== ctl) return;
    out.innerHTML = mdLite(r.text) + (r.truncated ? '<p class="muted small">Réponse coupée : pose une question plus précise.</p>' : '') + '<p class="ask-note">Réponse générée par Claude à partir de la fiche. Vérifie toujours dans les sources.</p>';
  } catch (e) {

    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ out.innerHTML = '<p class="muted">Les questions à Claude ne sont pas disponibles ici.</p>'; S.sample = null; return; }
    const msg = code === 'rate_limited' ? "Trop de questions d'un coup : réessaie dans quelques minutes."
      : code === 'session_expired' ? 'Ta session a expiré : reconnecte-toi à Claude.'
      : code === 'refused' ? "Claude n'a pas pu répondre à cette question. Essaie de la reformuler."
      : 'La réponse a été interrompue. Réessaie dans un instant.';
    out.innerHTML = (e && e.text && code !== 'refused' ? mdLite(e.text) : '') + '<p class="muted">' + esc(msg) + '</p>';
  }
}

/* ---------- Bouton Retour du téléphone ----------

const NAV = { timer:0, exiting:false };

  try { history.replaceState({ mds:'root' }, '', navUrl()); } catch (er) {}

}

/* Recherche d'une adresse ou d'un lieu : TomTom si une clé est enregistrée (lieux publics compris), sinon la Base Adresse Nationale. */
async function chercheLieu(q, near){

  const p = MPget(), qn = cmdNorm(q);
  const mine = p.lieux.filter(l => cmdNorm(l.nom) === qn || cmdNorm(l.nom).includes(qn) || qn.includes(cmdNorm(l.nom)));
  if (mine.length) return mine.map(l => ({ nom:l.nom, label:l.adr || l.nom, lat:l.lat, lon:l.lon, mine:true }));
  if (!online()) return [];
  const bias = near ? '&lat=' + r2(near.lat) + '&lon=' + r2(near.lon) : '';
  if (p.tomtom){
    try {
      const j = await fetchJSON('https://api.tomtom.com/search/2/search/' + encodeURIComponent(q) + '.json?key=' + encodeURIComponent(p.tomtom) + '&countrySet=FR&language=fr-FR&limit=5' + bias, 9000);

      if (out.length) return out;
    } catch (e) {}
  }
  const list = [];
  try {
    const j = await fetchJSON('https://data.geopf.fr/geocodage/search?q=' + encodeURIComponent(q) + '&limit=5&autocomplete=0' + bias, 9000);
    (j.features || []).forEach(f => { const pr = f.properties || {}, c = f.geometry && f.geometry.coordinates; if (c) list.push({ nom: pr.type === 'municipality' ? pr.city : (pr.name || pr.label), label: pr.label + (pr.context ? ' (' + String(pr.context).split(',')[0] + ')' : ''), lat:c[1], lon:c[0], score:pr.score || 0 }); });
  } catch (e) {}
  if ((!list.length || list[0].score < 0.55) && /\b(mairie|hopital|hôpital|clinique|gare|college|collège|lycee|lycée|ecole|école|centre|magasin|supermarche|supermarché|caserne|stade|piscine|usine|zone|parc|aeroport|aéroport|chu|ehpad|poste|prefecture|préfecture)\b/i.test(q)){
    try {
      const j = await fetchJSON('https://data.geopf.fr/geocodage/search?q=' + encodeURIComponent(q) + '&index=poi&limit=5' + bias, 9000);
      const poi = (j.features || []).map(f => { const pr = f.properties || {}, c = f.geometry && f.geometry.coordinates; const city = [].concat(pr.city || [])[0] || ''; return c ? { nom: pr.toponym || [].concat(pr.name || [])[0] || q, label: (pr.toponym || q) + (city ? ' · ' + city : ''), lat:c[1], lon:c[0], score:0.6 } : null; }).filter(Boolean);
      if (near) poi.sort((a, b) => kmBetween(near, a) - kmBetween(near, b));
      list.unshift(...poi.slice(0, 3));
    } catch (e) {}
  }
  return list;
}

/* ---------- Météo (modèles de Météo-France : AROME, ARPEGE, via Open-Meteo, gratuit et sans clé) ---------- */
const WMO = c => c == null ? '' : c === 0 ? 'ciel dégagé' : c <= 2 ? 'quelques nuages' : c === 3 ? 'ciel couvert' : c <= 48 ? 'brouillard' : c <= 57 ? 'bruine' : c <= 67 ? 'pluie' : c <= 77 ? 'neige' : c <= 82 ? 'averses' : c <= 86 ? 'averses de neige' : 'orages';
const WICON = c => c == null ? 'cloud' : c <= 1 ? 'sun' : c <= 3 ? 'cloud' : c <= 48 ? 'fog' : (c <= 67 || (c >= 80 && c <= 82)) ? 'rain' : (c <= 77 || c === 85 || c === 86) ? 'snow' : 'storm';
async function meteoFetch(pos){
  const base = 'https://api.open-meteo.com/v1/forecast?latitude=' + pos.lat + '&longitude=' + pos.lon + '&timezone=Europe%2FParis';
  const j = await fetchJSON(base + '&models=meteofrance_seamless&forecast_days=2&current=temperature_2m,apparent_temperature,weather_code,wind_gusts_10m,precipitation' +
    '&hourly=temperature_2m,apparent_temperature,precipitation,weather_code,wind_gusts_10m,visibility', 12000);
  let uv = null; try { const a = await fetchJSON(base + '&forecast_days=1&daily=uv_index_max', 8000); uv = a.daily && a.daily.uv_index_max ? a.daily.uv_index_max[0] : null; } catch (e) {}
  return { j, uv, at:Date.now(), lat:pos.lat, lon:pos.lon };
}
function meteoResume(w, place){
  const j = w.j || {}, H = j.hourly || {}, T = H.time || [], now = new Date(), hNow = now.getHours();
  const v = (k, i) => { const a = H[k]; return a ? a[i] : null; };
  let i0 = T.indexOf(hourKey(now)); if (i0 < 0) i0 = Math.max(0, T.findIndex(x => x > hourKey(now)));
  const iEnd = Math.min(T.length, i0 + (hNow < 14 ? Math.max(6, 20 - hNow) : 12));
  const rg = []; for (let i = i0; i < iEnd; i++) rg.push(i);
  if (!rg.length) return null;
  const nums = a => a.filter(x => typeof x === 'number');
  const temps = nums(rg.map(i => v('temperature_2m', i)));
  const cur = j.current || {};
  const t0 = Math.round(typeof cur.temperature_2m === 'number' ? cur.temperature_2m : temps[0]);
  const f0 = Math.round(typeof cur.apparent_temperature === 'number' ? cur.apparent_temperature : (v('apparent_temperature', i0) ?? t0));
  const tmax = Math.round(Math.max(...temps, t0)), tmin = Math.round(Math.min(...temps, t0));
  const fMatin = Math.round(Math.min(f0, ...nums(rg.slice(0, 3).map(i => v('apparent_temperature', i)))));
  const hOf = i => +String(T[i]).slice(11, 13);
  const wet = rg.filter(i => (v('precipitation', i) || 0) >= 0.2);
  let rain = null;
  if (wet.length){ const a = wet[0]; let b = a; for (const i of wet){ if (i - b <= 2) b = i; else break; } rain = { from:hOf(a), to:(hOf(b) + 1) % 24, now:a === i0, mm:Math.round(rg.filter(i => i >= a && i <= b).reduce((s, i) => s + (v('precipitation', i) || 0), 0) * 10) / 10 }; }
  const gust = Math.round(Math.max(0, ...nums(rg.map(i => v('wind_gusts_10m', i)))));
  const codes = rg.map(i => v('weather_code', i)), code = typeof cur.weather_code === 'number' ? cur.weather_code : codes[0];
  const alerts = [];
  if (codes.some(c => c >= 95)) alerts.push('orages');
  if (codes.some(c => (c >= 71 && c <= 77) || c === 85 || c === 86)) alerts.push('neige');
  const froid = rg.slice(0, 6).some(i => (v('temperature_2m', i) ?? 9) <= 0.5);
  if (codes.some(c => [56, 57, 66, 67].includes(c)) || (froid && (wet.length || codes.slice(0, 6).some(c => c >= 51)))) alerts.push('verglas');
  else if (froid) alerts.push('gel, attention au verglas');
  if (rg.slice(0, 5).some(i => [45, 48].includes(v('weather_code', i)) || (typeof v('visibility', i) === 'number' && v('visibility', i) < 1000))) alerts.push('brouillard');
  if (gust >= 70) alerts.push(gust >= 90 ? 'vent violent' : 'fortes rafales');
  if (rg.reduce((s, i) => s + (v('precipitation', i) || 0), 0) >= 15) alerts.push('fortes pluies');
  const tenue = fMatin <= 0 ? 'manteau chaud, bonnet et gants' : fMatin <= 6 ? 'manteau ou grosse veste' : fMatin <= 12 ? 'veste chaude' : fMatin <= 17 ? 'veste légère ou pull' : fMatin <= 23 ? 'tee-shirt et une petite laine' : 'tenue légère';
  const plus = [];
  if (rain) plus.push(gust >= 50 ? 'un imperméable à capuche plutôt qu\'un parapluie' : 'un parapluie');
  if (tmax - fMatin >= 10) plus.push('habille-toi en couches, il fera bien plus doux ensuite');
  if ((w.uv || 0) >= 6 && !rain) plus.push('lunettes de soleil et crème');
  const conseil = cap(tenue) + (plus.length ? ', ' + plus.join(', ') : '') + '.';
  const p = [];
  p.push('Météo' + (place ? ' à ' + place : '') + ' : ' + t0 + ' degrés en ce moment' + (Math.abs(f0 - t0) >= 2 ? ', ressenti ' + f0 : '') + (WMO(code) ? ', ' + WMO(code) : '') + '.');
  p.push(hNow < 14 ? 'Jusqu\'à ' + tmax + ' degrés cet après-midi.' : 'Entre ' + tmin + ' et ' + tmax + ' degrés dans les prochaines heures.');
  p.push(rain ? (rain.now ? 'Il pleut en ce moment, jusque vers ' + rain.to + ' heures.' : 'Pluie entre ' + rain.from + ' heures et ' + rain.to + ' heures.') : 'Pas de pluie prévue.');
  if (gust >= 50) p.push('Rafales jusqu\'à ' + gust + ' kilomètres heure.');
  if (alerts.length) p.push('Attention : ' + alerts.join(', ') + '.');
  p.push('Conseil : ' + conseil);
  const buffer = alerts.some(a => /verglas|neige|brouillard/.test(a)) ? 10 : alerts.includes('fortes pluies') ? 5 : 0;
  return { place, t0, f0, tmin, tmax, code, rain, gust, alerts, conseil, buffer, text:p.join(' '), at:w.at };
}
async function meteoMaj(force, ask){
  const M = S.matin = S.matin || {};

  if (!force && M.wx && Date.now() - M.wx.at < 20 * 60000) return M.wx;

/* ---------- Trafic : Bison Futé (routes nationales, relevé toutes les 20 minutes) et TomTom (toutes les routes, avec une clé) ---------- */
const BF_URL = 'https://raw.githubusercontent.com/hadesdray-crypto/matinale/trafic/trafic.json';
async function bisonFute(){
  const M = S.matin = S.matin || {};
  if (M.bf && Date.now() - M.bfAt < 10 * 60000) return M.bf;
  if (!online()) return M.bf || null;
  try { const j = await fetchJSON(BF_URL + '?t=' + Math.floor(Date.now() / 300000), 10000); if (j && Array.isArray(j.ev)){ M.bf = j; M.bfAt = Date.now(); } } catch (e) {}
  return M.bf || null;
}
const BF_SKIP = new Set(['vitesse réduite', 'aire de service fermée', 'perturbation']);
function bfSurTrajet(bf, a, b, pts){
  if (!bf || !bf.ev) return [];
  const near = e => {
    const ps = [{ lat:e.y, lon:e.x }].concat(e.y2 ? [{ lat:e.y2, lon:e.x2 }] : []);
    if (pts && pts.length > 1){ const st = Math.max(1, Math.ceil(pts.length / 400)); for (const q of ps) for (let i = 0; i + st < pts.length + st; i += st){ const k = Math.min(i, pts.length - 1), k2 = Math.min(k + st, pts.length - 1); if (kmToSeg(q, { lat:pts[k][0], lon:pts[k][1] }, { lat:pts[k2][0], lon:pts[k2][1] }) < 1.2) return true; } return false; }
    return ps.some(q => kmToSeg(q, a, b) < 4);
  };
  return bf.ev.filter(e => !BF_SKIP.has(e.t) && near(e)).sort((x, y) => (y.s || 0) - (x.s || 0));
}
const bfPhrase = e => cap(e.t) + (e.r ? ' sur la ' + e.r : '') + (e.v ? ' vers ' + e.v : '');
const TT_CAT = { JAM:'bouchon', ROAD_WORK:'travaux', ROAD_CLOSURE:'route fermée', OTHER:'ralentissement' };
async function tomtomRoute(a, b){
  const k = MPget().tomtom; if (!k) return null;
  const u = 'https://api.tomtom.com/routing/1/calculateRoute/' + r3(a.lat) + ',' + r3(a.lon) + ':' + r3(b.lat) + ',' + r3(b.lon) + '/json?key=' + encodeURIComponent(k) +
    '&traffic=true&travelMode=car&routeType=fastest&departAt=now&sectionType=traffic&computeTravelTimeFor=all';
  const j = await fetchJSON(u, 15000);
  const R = j.routes && j.routes[0]; if (!R) return null;
  const s = R.summary || {}, m = x => typeof x === 'number' ? Math.round(x / 60) : null;
  return { min:m(s.travelTimeInSeconds), usual:m(s.historicTrafficTravelTimeInSeconds), libre:m(s.noTrafficTravelTimeInSeconds), km:Math.round((s.lengthInMeters || 0) / 100) / 10,
    pts:[].concat(...(R.legs || []).map(l => (l.points || []).map(p => [p.latitude, p.longitude]))),
    jams:(R.sections || []).filter(x => x.sectionType === 'TRAFFIC').map(x => ({ cat:TT_CAT[x.simpleCategory] || 'ralentissement', min:Math.round((x.delayInSeconds || 0) / 60) })) };
}
async function osrmRoute(a, b){
  const j = await fetchJSON('https://router.project-osrm.org/route/v1/driving/' + r3(a.lon) + ',' + r3(a.lat) + ';' + r3(b.lon) + ',' + r3(b.lat) + '?overview=simplified&geometries=geojson', 10000);
  const R = j && j.routes && j.routes[0]; if (!R) return null;
  return { min:Math.round(R.duration / 60), km:Math.round(R.distance / 100) / 10, usual:null, libre:Math.round(R.duration / 60), sansTrafic:true,
    pts:((R.geometry && R.geometry.coordinates) || []).map(c => [c[1], c[0]]), jams:[] };
}
async function trajet(a, b){
  const res = { r:null, err:null, ev:[] };
  if (MPget().tomtom && online()){ try { res.r = await tomtomRoute(a, b); } catch (e) { res.err = (e.status === 401 || e.status === 403) ? 'cle' : 'reseau'; } }
  if (!res.r && online()){ try { res.r = await osrmRoute(a, b); } catch (e) {} }   /* sans clé TomTom : distance et temps sans trafic */
  const bf = await bisonFute();
  res.ev = bfSurTrajet(bf, a, b, res.r && res.r.pts);
  res.at = Date.now();
  return res;
}
/* État de la route : y a-t-il quelque chose qui change le temps de trajet habituel ? */
function routeEtat(res){
  const r = res.r, causes = [];
  let retard = null;
  if (r && !r.sansTrafic){
    const d = r.usual != null ? r.min - r.usual : r.jams.reduce((x, j) => x + j.min, 0);
    if (d >= 3) retard = d;
    r.jams.filter(j => j.min >= 2).forEach(j => causes.push(cap(j.cat) + ' : +' + j.min + ' min'));
  }
  res.ev.slice(0, 3).forEach(e => causes.push(bfPhrase(e)));
  /* Sans trafic en direct, une marge selon ce que signale Bison Futé (estimation). */
  const marge = retard == null && res.ev.length ? (res.ev.some(e => /accident|bouchon|arrêt|coupée|fermée|obstacle/.test(e.t)) ? 15 : 5) : 0;
  return { probleme: !!(retard || causes.length), retard, marge, causes };
}
function trajetPhrases(res){
  const p = [], r = res.r, E = routeEtat(res);
  if (!r && !res.ev.length){
    p.push(!online() ? 'Pas de réseau : je ne peux pas vérifier la route.' : res.err === 'cle' ? 'La clé TomTom ne marche pas : vérifie-la dans les réglages.' : 'Je n\'ai pas d\'information sur la route pour l\'instant.');
    return p;
  }
  if (!E.probleme){ p.push('Route normale' + (r ? ', environ ' + r.min + ' minutes' : '') + ' : rien de signalé, sauf imprévu en route.'); return p; }
  if (E.retard) p.push('Attention : ' + E.retard + ' minutes de plus que d\'habitude, ' + r.min + ' minutes en tout.');
  const jams = r && !r.sansTrafic ? r.jams.filter(j => j.min >= 2) : [];
  if (jams.length) p.push(jams.length === 1 ? cap(jams[0].cat) + ' sur le trajet.' : jams.length + ' ralentissements sur le trajet.');
  if (res.ev.length) p.push((E.retard ? '' : 'Attention : ') + 'Bison Futé signale ' + res.ev.slice(0, 2).map(e => bfPhrase(e).replace(/^./, c => c.toLowerCase())).join(' ; ') + '.');
  if (!E.retard && E.marge) p.push('Prévois environ ' + E.marge + ' minutes de plus.');
  return p;
}

/* ---------- Où je vais aujourd'hui : bouton du matin, voix, ou planning de Memo-SSIAP (lu dans le téléphone) ---------- */
function lieuParNom(txt){
  const p = MPget(), q = cmdNorm(txt || ''); if (!q) return null;
  return p.lieux.find(l => cmdNorm(l.nom) === q) || p.lieux.find(l => q.includes(cmdNorm(l.nom)) || cmdNorm(l.nom).includes(q) || cmdNorm(l.adr || '').includes(q)) || null;
}
function memoPlanning(day){
  let P = null; try { P = JSON.parse(localStorage.getItem('memo-ssiap:planning') || 'null'); } catch (e) {}
  const es = (P && Array.isArray(P.e) ? P.e : []).filter(e => e && e.d === day && /^\d{1,2}:\d{2}$/.test(e.deb || '')).sort((x, y) => String(x.deb).localeCompare(String(y.deb)));
  if (!es.length) return null;
  const e = es[0], L = lieuParNom(e.lieu || e.aff || '');
  return { date:day, heure:e.deb, lieu: L ? L.id : null, lieuTxt: e.lieu || '', src:'memo' };
}
function jourDuJour(){
  const p = MPget(), day = isoDay(new Date());
  if (p.jour && p.jour.date === day) return p.jour.choix ? null : p.jour;
  if (p.memo){ const m = memoPlanning(day); if (m) return m; }
  return null;
}
function fixeJour(j){ const p = MPget(); p.jour = Object.assign({ date:isoDay(new Date()) }, j); MPset(p); S.matin = S.matin || {}; S.matin.rt = null; }
async function routeDuJour(force, ask){
  const M = S.matin = S.matin || {};
  const job = jourDuJour(), p = MPget();
  if (!job || job.repos){ M.rt = null; return null; }
  const L = p.lieux.find(l => l.id === job.lieu);
  if (!L){ M.rt = { job, manque:true }; return M.rt; }
  if (!force && M.rt && M.rt.L && M.rt.L.id === L.id && Date.now() - M.rt.at < 5 * 60000) return M.rt;
  let a = null;
  const g = online() && (ask || (await geoState()) === 'granted') ? await geoPos(true) : null;
  if (g) a = g; else { const h = p.lieux.find(l => l.type === 'maison'); if (h) a = { lat:h.lat, lon:h.lon }; }
  if (!a){ M.rt = { job, L, sansDepart:true, at:Date.now() }; return M.rt; }
  if (kmBetween(a, L) < 0.4){ M.rt = { job, L, surPlace:true, at:Date.now() }; return M.rt; }
  const res = await trajet(a, L);
  const arr = atToday(job.heure), wx = M.wx;
  let pars = null; const E = routeEtat(res);
  if (arr && res.r && res.r.min != null) pars = new Date(arr.getTime() - (res.r.min + (p.marge || 0) + (wx ? wx.buffer || 0 : 0) + E.marge) * 60000);
  M.rt = Object.assign({ job, L, a, pars }, res);

}
function routePhrases(rt){
  if (!rt) return [];
  const p = MPget();
  const quand = rt.job && rt.job.heure ? ', prise de poste à ' + hSay(atToday(rt.job.heure)) : '';
  if (rt.manque) return ['Aujourd\'hui : ' + (rt.job.lieuTxt || 'lieu inconnu') + quand + '. Ce lieu n\'est pas dans tes lieux enregistrés : ajoute-le dans les réglages du matin.'];
  const out = ['Aujourd\'hui : ' + rt.L.nom + quand + '.'];
  if (rt.surPlace) return out.concat(['Tu y es déjà.']);
  if (rt.sansDepart) return out.concat(['Je ne connais pas ta position : active la localisation, ou enregistre ta maison dans les réglages.']);
  out.push(...trajetPhrases(rt));
  const arr = rt.job && atToday(rt.job.heure);
  if (arr && arr.getTime() < Date.now()) out.push('L\'heure de prise de poste est déjà passée.');
  else if (rt.pars){
    const wx = S.matin && S.matin.wx, buf = wx && wx.buffer ? wx.buffer : 0, E = routeEtat(rt);
    if (rt.pars.getTime() < Date.now()) out.push('Tu es un peu juste : en partant maintenant, arrivée vers ' + hSay(new Date(Date.now() + (rt.r.min + E.marge) * 60000)) + '.');
    else if (E.probleme || buf) out.push((buf ? 'Avec la météo, compte ' + buf + ' minutes de plus. ' : '') + 'Pars avant ' + hSay(rt.pars) + '.');   /* route normale : pas besoin d'en dire plus */
  }
  return out;
}

/* Réponse à « Où vas-tu aujourd'hui ? » : « Évreux, 8 h 45 », « je vais à Louviers », « repos », « c'est bon »… */
function jourReponse(raw, s){
  if (!S.awaitJour || S.awaitJour.until < Date.now()) return null;
  if (/ (c est bon|passe|passer|rien|pas de trajet|suivant|les infos|informations|laisse tomber|non) /.test(s) && !/\d/.test(s)){
    S.awaitJour = null; matinInfos(); return { msg:'On passe aux informations scientifiques.', keep:true };
  }
  if (/ repos /.test(s)){ S.awaitJour = null; clearTimeout(S.jourT); fixeJour({ repos:true }); matinDire('matin-route', 'Ta route', 'Repos aujourd\'hui.' + MATIN_SUITE); return { msg:'Repos aujourd\'hui.', keep:true }; }
  const h = heureDite(s);
  const lieu = String(raw).split(/\s+/).filter(w => { const n = cmdNorm(w); return n && !/^\d/.test(n) && !n.split(' ').every(x => JOUR_MOTS.has(x)); }).join(' ').replace(/^[,.;:\s]+|[,.;:\s]+$/g, '');
  if (!lieu) return { msg:'Je n\'ai pas compris le lieu. Redis, par exemple : Évreux.', fail:true };
  S.awaitJour = null; clearTimeout(S.jourT);
  (async () => {
    let L = lieuParNom(lieu);
    if (!L){
      const x = (await chercheLieu(lieu, LS.get('mds.pos', null)))[0];
      if (x){ const pp = MPget(); L = { id:'l' + Date.now().toString(36), nom:cap(lieu).slice(0, 40), adr:x.label || '', lat:r3(x.lat), lon:r3(x.lon), type:'travail' }; pp.lieux.push(L); MPset(pp); }
    }
    if (!L){ matinDire('matin-route', 'Ta route', 'Je ne trouve pas ' + lieu + '.' + MATIN_SUITE); return; }
    fixeJour({ lieu:L.id, heure:h || '' });
    await routeDuJour(true, true); matinRedraw();
    matinDire('matin-route', 'Ta route', routePhrases(S.matin.rt).join(' ') + MATIN_SUITE);
  })();
  return { msg:'Trajet vers ' + lieu + (h ? ' pour ' + hhmmDisp(h) : '') + '…', keep:true };
}

/* Surveillance : la route est revérifiée toutes les 5 minutes tant que l'appli est ouverte. */
function watchStart(d){
  watchStop(true);
  S.watch = { d, last:null, until:Date.now() + 3 * 3600e3 };
  const tick = async () => {
    const w = S.watch; if (!w) return;
    if (Date.now() > w.until){ watchStop(); return; }
    if (document.visibilityState !== 'visible' || !online()) return;
    const g = await geoPos(true); if (!g) return;
    if (kmBetween(g, w.d) < 0.3){ sayShort('Tu es arrivé. J\'arrête la surveillance.'); watchStop(); return; }
    const res = await trajet(g, w.d), prev = w.last;
    w.last = { min: res.r ? res.r.min : null, ids: res.ev.map(e => e.id) };
    if (prev){
      const msgs = [];
      if (prev.min != null && w.last.min != null && Math.abs(w.last.min - prev.min) >= 5) msgs.push(w.last.min > prev.min ? 'La route se charge : ' + w.last.min + ' minutes maintenant, ' + (w.last.min - prev.min) + ' de plus.' : 'Ça se dégage : ' + w.last.min + ' minutes maintenant.');
      const nouv = res.ev.filter(e => !prev.ids.includes(e.id)); if (nouv.length) msgs.push('Nouveau sur ta route : ' + nouv.slice(0, 2).map(bfPhrase).join(' ; ') + '.');
      if (msgs.length){ vbub(msgs.join(' '), false, 7000); sayShort(msgs.join(' ')); }
    }
    matinRedraw();
  };
  S.watch.timer = setInterval(tick, 5 * 60000); tick();
  vbub('Je surveille la route vers ' + d.nom + ' (toutes les 5 minutes, appli ouverte).', false, 4000);
  matinRedraw();
}
function watchStop(silent){ if (S.watch){ clearInterval(S.watch.timer); S.watch = null; if (!silent) vbub('Surveillance de la route arrêtée.', false, 2500); matinRedraw(); } }

/* ---------- Voix hors connexion (Vosk, modèle français libre Apache 2.0, gardé dans le téléphone) ---------- */
const VOSK_FILES = ['vendor/vosk.js', 'voix/vosk-fr.tar.gz'];
const VK = { model:null, loading:null };
async function voskDownload(){
  const bar = () => $('#vosk-pbar'); const b0 = bar(); if (b0) b0.hidden = false;
  const c = await caches.open('matinale-voix'); let fait = 0; const total = 48.1e6;
  for (const u of VOSK_FILES){
    const deja = await c.match(u); if (deja){ fait += u.endsWith('.gz') ? 42.2e6 : 5.8e6; continue; }
    const r = await fetch(u, { cache:'no-store' }); if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const rd = r.body.getReader(), parts = []; let n = 0;
    for (;;){ const x = await rd.read(); if (x.done) break; parts.push(x.value); n += x.value.length; const b = bar(); if (b) b.firstChild.style.width = Math.min(100, Math.round((fait + n) / total * 100)) + '%'; }
    await c.put(u, new Response(new Blob(parts), { headers:{ 'Content-Type': u.endsWith('.js') ? 'text/javascript' : 'application/gzip' } }));
    fait += n;
  }
  LS.set('mds.voskok', true); Voice.ok = true;
}
async function voskLoad(){
  if (VK.model) return VK.model;
  if (VK.loading) return VK.loading;
  VK.loading = (async () => {
    const c = await caches.open('matinale-voix');
    if (!window.Vosk){
      const js = await c.match(VOSK_FILES[0]); if (!js) throw new Error('absent');
      const u = URL.createObjectURL(await js.blob());
      await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
    }
    const m = await c.match(VOSK_FILES[1]); if (!m) throw new Error('absent');
    VK.model = await window.Vosk.createModel(URL.createObjectURL(await m.blob()));
    return VK.model;
  })();
  try { return await VK.loading; } finally { VK.loading = null; }
}
/* Écoute le micro avec la voix hors connexion ; rend une fonction pour arrêter. */
async function voskEcoute(onText){
  const model = await voskLoad();
  const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 }, video:false });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const rec = new model.KaldiRecognizer(ctx.sampleRate);
  rec.on('result', m => { const tx = m && m.result && m.result.text; if (tx && tx.trim()) onText(tx.trim()); });
  const src = ctx.createMediaStreamSource(stream), node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = ev => { try { rec.acceptWaveform(ev.inputBuffer); } catch (e) {} };
  src.connect(node); node.connect(ctx.destination);
  return () => { try { node.disconnect(); src.disconnect(); } catch (e) {} try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {} try { ctx.close(); } catch (e) {} try { if (rec.remove) rec.remove(); } catch (e) {} };
}
/* Quel moteur ? 'google' (en ligne), 'vosk' (hors connexion) ou null. */
function moteurVoix(libre){
  const m = MPget().moteur, vr = !!LS.get('mds.voskok', false), g = !!SRec && online();
  if (m === 'local') return vr ? 'vosk' : (g ? 'google' : null);
  if (m === 'google') return g ? 'google' : (vr ? 'vosk' : null);
  if (libre && vr) return 'vosk';
  return g ? 'google' : (vr ? 'vosk' : null);
}

/* ---------- Mode mains libres : « Matinale, … » sans toucher le téléphone (appli ouverte, écran allumé) ---------- */
const Libre = { on:false, eng:null, stop:null, rec:null, err:null, last:0, armed:0, mute:0, wake:null, idle:0 };
const WAKE = /^(?:ok |okay |dis |he |eh |bonjour |allo )?(?:la |ma )?(?:matinale?s?|matina|matin al|ma tinale|martinale|matinee)\b ?(.*)$/;
async function libreStart(){

  libreUI(); libreLock();

  sayShort('Mode mains libres activé. Dis Matinale, puis ta demande.');
}
async function libreMoteur(){
  if (!Libre.on || document.visibilityState !== 'visible') return;
  if (Libre.eng === 'vosk'){
    if (Libre.stop) return;
    if (!VK.model) vbub('Chargement de la voix hors connexion…', true);
    try { Libre.stop = await voskEcoute(t => libreEntendu([t])); vbub(''); }
    catch (e) {
      Libre.stop = null;
      if (SRec && online()){ Libre.eng = 'google'; libreGoogle(); }
      else libreArret(false, (e && e.name === 'NotAllowedError') ? 'Le micro est refusé : autorise-le dans les réglages du navigateur.' : 'La voix hors connexion ne démarre pas sur ce téléphone.');
    }

}
function libreGoogle(){
  if (!Libre.on || Libre.eng !== 'google' || Libre.rec || document.visibilityState !== 'visible') return;
  let r; try { r = new SRec(); } catch (e) { libreArret(false, 'La reconnaissance vocale ne démarre pas.'); return; }
  r.lang = 'fr-FR'; r.continuous = true; r.interimResults = false; r.maxAlternatives = 3;
  r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++){ const res = e.results[i]; if (res && res.isFinal) libreEntendu(Array.from(res).map(a => a.transcript)); } };
  r.onerror = e => { Libre.err = e && e.error; };
  r.onend = () => {
    if (Libre.rec === r) Libre.rec = null;
    const err = Libre.err; Libre.err = null;
    if (!Libre.on || Libre.eng !== 'google') return;
    if (err === 'not-allowed' || err === 'service-not-allowed'){ libreArret(false, 'Le micro est refusé : autorise-le dans les réglages du navigateur.'); return; }
    if (err === 'network' || !online()){
      if (LS.get('mds.voskok', false)){ Libre.eng = 'vosk'; libreMoteur(); vbub('Plus de réseau : je passe à la voix hors connexion.', false, 4000); }
      else libreArret(false, 'Plus de réseau : le mode mains libres s\'arrête. Télécharge la voix hors connexion pour l\'utiliser sans réseau.');
      return;
    }
    setTimeout(libreGoogle, err === 'no-speech' || !err ? 60 : 500);
  };
  try { r.start(); Libre.rec = r; } catch (e) { setTimeout(libreGoogle, 1000); }
}
function librePause(){ if (Libre.stop){ try { Libre.stop(); } catch (e) {} Libre.stop = null; } if (Libre.rec){ const r = Libre.rec; Libre.rec = null; try { r.abort(); } catch (e) {} } }

}

function libreVeille(){ if (Libre.on && !Player.playing && !(Player.synth && Player.synth.speaking) && Date.now() - Libre.last > 10 * 60000) libreArret(false, 'Dix minutes sans demande : j\'arrête le mode mains libres.'); }

function libreEntendu(alts){
  if (!Libre.on || Date.now() < Libre.mute) return;
  const now = Date.now();
  for (const raw of alts){
    const s = cmdNorm(raw), m = WAKE.exec(s);
    if (m){
      const rest = (m[1] || '').trim();

/* Commandes vocales du matin (appelées par voiceCommand). Rend { msg, keep } ou null. */
function matinCommande(s, raw){
  if (S.yesNo && S.yesNo.until > Date.now()){
    if (/ (oui|ouais|ok|okay|d accord|vas y|volontiers|bien sur|je veux bien|surveille) /.test(s)){ const f = S.yesNo.yes; S.yesNo = null; if (f) f(); return { msg:'D\'accord.', keep:true }; }
    if (/ (non|pas besoin|c est bon|laisse) /.test(s)){ const f = S.yesNo.no; S.yesNo = null; if (f) f(); return { msg:'D\'accord.', keep:true }; }
  }
  if (/ (mains libres|main libre|mains libre) /.test(s)){ if (/ (arrete|stop|desactive|coupe|fin) /.test(s)){ libreArret(); return { msg:'Mains libres arrêté.', keep:true }; } libreStart(); return { msg:'Mains libres activé.', keep:true }; }
  if (/ (arrete d ecouter|arrete de m ecouter|ne m ecoute plus) /.test(s)){ libreArret(); return { msg:'Mains libres arrêté.', keep:true }; }
  if (/ point du matin | mon point /.test(s)){ matinEcoute(); return { msg:'Ton point du matin.', keep:true }; }
  if (/ (arrete|stop|fin) (la )?surveillance /.test(s)){ watchStop(); return { msg:'Surveillance arrêtée.' }; }
  if (/ surveille (la route|le trajet)? /.test(s)){ const d = (S.iti && S.iti.d) || (S.matin && S.matin.rt && S.matin.rt.L); if (d){ watchStart({ nom:d.nom, lat:d.lat, lon:d.lon }); return { msg:'Je surveille la route.', keep:true }; } }
  if (/ reglages? /.test(s) && / (matin|meteo|trajet|voix) /.test(s)){ openMatinReglages(); return { msg:'Les réglages du matin.' }; }
  if (/ repos /.test(s) && / (aujourd hui|je suis|c est|journee) /.test(s)){ fixeJour({ repos:true }); matinRedraw(); return { msg:'Repos aujourd\'hui : pas de trajet.' }; }
  /* « aujourd'hui Évreux 8 h 45 », « aujourd'hui je travaille à Louviers à 8 heures 15 » */
  if (/ aujourd hui /.test(s) || / je (travaille|bosse|commence|prends mon poste|vais) /.test(s)){
    const L = MPget().lieux.find(l => l.type !== 'maison' && s.includes(' ' + cmdNorm(l.nom) + ' ')) || MPget().lieux.find(l => cmdNorm(l.nom).split(' ').some(w => w.length > 3 && s.includes(' ' + w + ' ')));
    const h = heureDite(s);
    if (L){ fixeJour({ lieu:L.id, heure:h || (MPget().heures[0] || '') }); matinMaj(true); return { msg:'Aujourd\'hui : ' + L.nom + (h ? ' à ' + hhmmDisp(h) : '') + '.', speak:true }; }
  }
  /* itinéraire vers … */
  const mi = /(?:itineraire|trajet|route|aller|emmene moi|conduis moi|guide moi)\s+(?:vers|a|au|aux|pour|jusqu a|jusque|chez)\s+(.+)$/.exec(s);
  if (mi){
    let dest = raw.replace(/^[\s\S]*?\b(?:vers|à|a|au|aux|pour|jusqu['’ ]à|jusque|chez)\s+/i, '').trim() || mi[1];
    if (!S.sheetOpen || !$('#iti-form')) openIti(); const inp = $('#iti-q'); if (inp) inp.value = dest;
    itiCalc(dest, { say:true }); return { msg:'Itinéraire vers ' + dest + '…', keep:true };
  }
  if (/ (itineraire|trajet|route|trafic|circulation|bouchons?) /.test(s)){
    routeDuJour(true).then(rt => { matinRedraw(); const ph = routePhrases(rt); sayShort(ph.length ? ph.join(' ') : 'Dis-moi où tu vas, par exemple : itinéraire vers Évreux.'); });
    return { msg:'Je regarde la route…', keep:true };
  }
  if (/ (meteo|temps qu il fait|quel temps|parapluie|tenue|m habiller|habiller) /.test(s)){
    meteoMaj(true, true).then(wx => { matinRedraw(); sayShort(wx ? wx.text : 'Je n\'ai pas la météo : autorise la localisation ou choisis une ville.'); });
    return { msg:'La météo…', keep:true };
  }
  return null;
}
function heureDite(s){
  let m = /(?:^| )(\d{1,2}) ?(?:h|heures?|:)? ?(\d{2})?(?= |$)/.exec(s.replace(/ heures? /g, ' h '));

  const U = { une:1, un:1, deux:2, trois:3, quatre:4, cinq:5, six:6, sept:7, huit:8, neuf:9, dix:10, onze:11, douze:12, treize:13, quatorze:14, quinze:15, seize:16, vingt:20, trente:30, quarante:40, cinquante:50, midi:12 };

/* ---------- Commande vocale ----------
   Le micro n'écoute que lorsqu'on touche le bouton, ou juste après la question de fin du flash.
   La reconnaissance vocale est celle du téléphone (sur Android, le service de Google, comme une dictée).
   Les phrases sont comprises ici même, sans IA : numéros, mots des titres et quelques commandes. */
const SRec = (typeof window !== 'undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);
const Voice = {
  ok: !!SRec || !!LS.get('mds.voskok', false), rec:null, on:false, ctx:'cmd', resume:false, got:false, err:null, tries:0, vstop:null,
  start(ctx, retry){
    if (Libre.on){ if (!ctx && !retry) libreArret(); else if (ctx === 'ask' || ctx === 'oui' || ctx === 'jour') Libre.armed = Date.now() + 12000; return; }   /* le bouton micro arrête le mode mains libres ; sinon il écoute déjà */
    if (!this.ok){ openVoiceHelp(); return; }
    if (this.on){
      if (ctx && this.got){ const r0 = this.rec; this.rec = null; this.on = false; clearTimeout(this.vt); if (this.vstop){ try { this.vstop(); } catch (e) {} this.vstop = null; } try { if (r0) r0.abort(); } catch (e) {} }   /* une question suit la réponse précédente : on relance l'écoute */
      else { this.stop(); return; }
    }
    const sid = this.sid = (this.sid || 0) + 1;   /* une écoute à la fois : les signaux d'une écoute terminée sont ignorés */
    if (!retry) this.tries = 0;
    this.ctx = ctx || (askOpen() ? 'ask' : 'cmd'); this.got = false; this.err = null;
    if (!retry) this.resume = !!Player.playing;   /* l'écoute en cours est mise en pause pendant qu'on parle, puis reprend */
    if (Player.playing) Player.pause();
    try { if (Player.synth && Player.synth.speaking) Player.synth.cancel(); } catch (e) {}
    const eng = moteurVoix(false);
    if (!eng){ vbub(online() ? 'La reconnaissance vocale n\'est pas disponible dans ce navigateur.' : 'Pas de réseau : télécharge la voix hors connexion dans les réglages du matin (une seule fois).', false, 5000); if (this.resume){ this.resume = false; Player.play(); } return; }
    if (eng === 'vosk'){
      this.on = true; micUI(); vbub(VK.model ? 'Je t\'écoute…' : 'Chargement de la voix hors connexion…', true); beep();
      const fini = () => { clearTimeout(this.vt); if (this.vstop){ try { this.vstop(); } catch (e) {} this.vstop = null; } this.on = false; micUI(); };
      voskEcoute(tx => { if (sid !== this.sid || this.got) return; this.got = true; fini(); this.handle([tx]); })
        .then(stop => { if (sid !== this.sid || this.got){ stop(); return; } this.vstop = stop; vbub('Je t\'écoute…', true); this.vt = setTimeout(() => { if (sid === this.sid && !this.got){ this.got = true; fini(); this.miss('no-speech'); } }, 9000); })
        .catch(e => { if (sid !== this.sid) return; this.got = true; fini(); this.miss(e && e.name === 'NotAllowedError' ? 'not-allowed' : 'vosk'); });
