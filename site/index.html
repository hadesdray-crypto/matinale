/* Layout : appli de lecture « mobile d'abord ». Bandeau cyanotype daté en tête, fil de fiches où la vidéo passe avant le texte,
   jauge de preuve à 4 niveaux sur chaque fiche, lecteur audio persistant, onglets en bas (mobile) ou en haut (écran large). */
:root{
  --paper:#F2F5F9; --card:#FFFFFF; --ink:#0E1A2C; --ink-2:#425069; --ink-3:#5A6780; --rule:#D7DEE8;
  --accent:#1B4A8A; --accent-ink:#163F78; --accent-soft:#E2EAF6; --on-accent:#FFFFFF;
  --band:#123A70; --band-2:#1D4C8B; --band-ink:#F3F7FD; --band-ink-2:#BED1EE;
  --screen:#0D2240; --screen-2:#1C3F72; --screen-ink:#F2F6FC; --screen-ink-2:#A9BFDF;
  --l4:#1D6E46; --l4-soft:#DFF0E6; --l3:#136870; --l3-soft:#DCEFF0; --l2:#955500; --l2-soft:#FAEDD4; --l1:#6A47A3; --l1-soft:#ECE5F7; --l0:#4A5568; --l0-soft:#E8ECF2;
  --warn:#8F3A1C; --warn-soft:#FAE8E0;
  --scrim:rgba(9,18,32,.5);
  --shadow:0 1px 2px rgba(14,26,44,.06),0 10px 28px rgba(14,26,44,.10);
  --display:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --serif:"Spectral","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#09121F; --card:#0F1B2D; --ink:#E6ECF5; --ink-2:#AAB7CB; --ink-3:#8794AB; --rule:#213149;
  --accent:#86B6F2; --accent-ink:#A3C7F6; --accent-soft:#15294A; --on-accent:#08121F;
  --band:#0E2A54; --band-2:#1A3E74; --band-ink:#EEF4FC; --band-ink-2:#A9C2E8;
  --screen:#061428; --screen-2:#153360; --screen-ink:#EEF3FB; --screen-ink-2:#9DB4D8;
  --l4:#63C995; --l4-soft:#10301F; --l3:#58C3CB; --l3-soft:#0E2E32; --l2:#F2AA45; --l2-soft:#33240D; --l1:#B79BEB; --l1-soft:#261B3C; --l0:#B4BFD0; --l0-soft:#1B2638;
  --warn:#F2957A; --warn-soft:#3A1D13;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.42);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#09121F; --card:#0F1B2D; --ink:#E6ECF5; --ink-2:#AAB7CB; --ink-3:#8794AB; --rule:#213149;
  --accent:#86B6F2; --accent-ink:#A3C7F6; --accent-soft:#15294A; --on-accent:#08121F;
  --band:#0E2A54; --band-2:#1A3E74; --band-ink:#EEF4FC; --band-ink-2:#A9C2E8;
  --screen:#061428; --screen-2:#153360; --screen-ink:#EEF3FB; --screen-ink-2:#9DB4D8;
  --l4:#63C995; --l4-soft:#10301F; --l3:#58C3CB; --l3-soft:#0E2E32; --l2:#F2AA45; --l2-soft:#33240D; --l1:#B79BEB; --l1-soft:#261B3C; --l0:#B4BFD0; --l0-soft:#1B2638;
  --warn:#F2957A; --warn-soft:#3A1D13;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.42);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* En-tête */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:9px}
.brand{display:inline-flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink)}
.brand-mark{width:32px;height:32px;flex:none;color:var(--accent)}
.brand-name{display:flex;flex-direction:column;line-height:1;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand-sub{margin-top:4px;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.top-nav{display:none;gap:2px;margin-left:auto}
.top-nav button{background:none;border:0;padding:9px 12px;border-radius:10px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.top-nav button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.top-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.top-actions{margin-left:auto;display:flex;gap:8px}
.edpill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);font-family:var(--mono);font-size:12.5px;white-space:nowrap;cursor:pointer}
.edpill:hover{border-color:var(--accent);color:var(--accent-ink)}
@media (min-width:1000px){.top-nav{display:flex}.top-actions{margin-left:6px}.tabbar{display:none!important}}
.hdr-fav[aria-current="page"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.brand{flex:none}
.top-actions{min-width:0;flex-shrink:1}
.edpill{min-width:0;overflow:hidden}
.edpill>span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:540px){.ed-n{display:none}}

/* Onglets (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:6px 1px;background:none;border:0;font-family:var(--display);font-weight:600;font-size:11px;color:var(--ink-3);cursor:pointer}
.tabbar{grid-template-columns:1.1fr .85fr .8fr .85fr 1fr 1.05fr}
.tabbar button span{white-space:nowrap}
@media (max-width:380px){.tabbar button{font-size:10px}}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}
.tabbar button[aria-current="page"] .ic{stroke-width:2.3}
main{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
body.has-mini main{padding-bottom:calc(144px + env(safe-area-inset-bottom,0px))}
@media (min-width:1000px){main{padding-bottom:48px}body.has-mini main{padding-bottom:112px}}

/* Bandeau de l'édition */
.masthead{position:relative;overflow:hidden;isolation:isolate;background:var(--band);color:var(--band-ink)}
.masthead::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.6;background:repeating-radial-gradient(circle at 96% -14%,transparent 0 30px,var(--band-2) 30px 31.5px);-webkit-mask-image:linear-gradient(to left,#000,transparent 72%);mask-image:linear-gradient(to left,#000,transparent 72%)}
.mh-in{position:relative;z-index:1;padding-block:24px 28px}
.mh-kicker{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-ink-2)}
.mh-date{display:flex;align-items:flex-end;gap:14px;margin:10px 0 16px;font-weight:inherit;font-size:inherit}
.mh-day{font-family:var(--display);font-weight:800;font-size:clamp(78px,19vw,138px);line-height:.8;letter-spacing:-.05em}
.mh-rest{display:flex;flex-direction:column;gap:5px;padding-bottom:4px;font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,30px);line-height:1}
.mh-wd{font-weight:600;color:var(--band-ink-2);text-transform:capitalize}
.mh-title{margin:0 0 10px;max-width:32ch;font-family:var(--display);font-weight:700;font-size:clamp(20px,4.8vw,27px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.mh-intro{margin:0 0 16px;max-width:64ch;font-size:17px;line-height:1.55;color:var(--band-ink)}
.mh-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12.5px;color:var(--band-ink-2)}
.mh-stats b{font-weight:500;color:var(--band-ink)}
.mh-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn-band{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--band-ink);background:var(--band-ink);color:var(--band);font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer}
.btn-band.ghost{background:transparent;color:var(--band-ink);border-color:var(--band-ink-2)}
.btn-band:hover{border-color:var(--band-ink)}
.oldbar{position:relative;z-index:2;background:var(--band-2)}
.oldbar-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;font-family:var(--display);font-weight:600;font-size:13.5px}
.skel{opacity:.35}

/* Sections */
.section{padding-block:30px 6px;scroll-margin-top:68px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:14px}
.sec-title{margin:0;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.015em;text-wrap:balance}
.sec-sub{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sub-h{margin:26px 0 10px;font-family:var(--display);font-weight:700;font-size:16px}
.sub-h.small{margin:16px 0 8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lede{margin:0 0 16px;max-width:68ch;color:var(--ink-2)}
.kicker{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:600;font-size:14px;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;border-radius:10px;font-size:13.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{color:var(--on-accent)}
.btn.ghost{background:transparent}
.iconbtn{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.iconbtn.lg{width:52px;height:52px;border-radius:16px}
.fav[aria-pressed="true"]{color:var(--l2);border-color:var(--l2)}
.fav[aria-pressed="true"] .ic path{fill:currentColor}
.linklike{all:unset;cursor:pointer}
.linklike:hover{color:var(--accent-ink)}
.linklike:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:4px}

/* Filtres */
.filters{display:grid;gap:10px;margin-bottom:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -2px;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.45;cursor:default}
.chip.sm{min-height:32px;padding:0 10px}
.chip.ghost{background:transparent}
.chip-n{font-family:var(--mono);font-weight:500;font-size:11.5px;opacity:.8}
.lvchip.lv4[aria-pressed="true"]{background:var(--l4);border-color:var(--l4);color:var(--card)}
.lvchip.lv3[aria-pressed="true"]{background:var(--l3);border-color:var(--l3);color:var(--card)}
.lvchip.lv2[aria-pressed="true"]{background:var(--l2);border-color:var(--l2);color:var(--card)}
.lvchip.lv1[aria-pressed="true"]{background:var(--l1);border-color:var(--l1);color:var(--card)}
.search{display:flex;align-items:center;gap:8px;max-width:520px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-family:var(--serif);font-size:16px}

/* Jauge de preuve */
.ev{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap}
.ev.big{padding:6px 12px 6px 10px;font-size:14px}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
.bars i{display:block;width:3.5px;border-radius:1px;background:currentColor;opacity:.25}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:13px}
.bars i.on{opacity:1}
.lv4{color:var(--l4);background:var(--l4-soft)}
.lv3{color:var(--l3);background:var(--l3-soft)}
.lv2{color:var(--l2);background:var(--l2-soft)}
.lv1{color:var(--l1);background:var(--l1-soft)}
.lv0{color:var(--l0);background:var(--l0-soft)}
.ev-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ev-type{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.lv4{background:var(--l4)}.dot.lv3{background:var(--l3)}.dot.lv2{background:var(--l2)}.dot.lv1{background:var(--l1)}.dot.lv0{background:var(--l0)}

/* Fiches du fil */
.feed{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:820px){.feed{grid-template-columns:1fr 1fr}}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:18px}
.card-media{display:grid;gap:8px;padding:10px 10px 0}
.more-v{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:12.5px;cursor:pointer}
.novid{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 10px 0;padding:9px 12px;border-radius:12px;background:var(--paper);color:var(--ink-3);font-family:var(--display);font-weight:600;font-size:12.5px}
.novid a{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);text-decoration:none}
.card-body{display:grid;gap:9px;min-width:0;padding:14px 16px 16px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.02em;color:var(--accent-ink)}
.new{padding:1px 6px;border:1px solid var(--accent);border-radius:6px;font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.card-title{margin:0;font-family:var(--serif);font-weight:700;font-size:20.5px;line-height:1.22;letter-spacing:-.005em;text-wrap:balance}
.dek{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.card-actions .fav{margin-left:auto}
.empty{grid-column:1/-1;display:grid;justify-items:center;gap:8px;padding:28px 16px;text-align:center;border:1px dashed var(--rule);border-radius:16px;color:var(--ink-2)}
.empty p{margin:0}

/* Vidéos */
.vt{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px}
.vt:hover{border-color:var(--accent)}
.vt:hover .vt-play{transform:scale(1.06)}
.vt-screen{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;overflow:hidden;color:var(--screen-ink);background:radial-gradient(130% 100% at 18% 0%,var(--screen-2),var(--screen) 72%)}
.vt-screen::before{content:"";position:absolute;inset:0;opacity:.28;background:repeating-linear-gradient(0deg,transparent 0 3px,var(--screen-2) 3px 4px)}
.vt-play{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--screen-ink);color:var(--screen);transition:transform .15s ease}
.vt-play .ic{transform:translateX(2px)}
.vt-badges{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px}
.vb{padding:4px 7px;border:1px solid var(--screen-ink-2);border-radius:6px;font-family:var(--mono);font-size:11px;line-height:1;color:var(--screen-ink)}
.vt-body{display:grid;gap:4px;min-width:0;padding:10px 12px 12px}
.vt-kind{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vt-kind.k-officielle{color:var(--l4)}
.vt-kind.k-tierce{color:var(--l2)}
.vt-title{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.vt-note{font-size:13.5px;line-height:1.4;color:var(--ink-3)}
.vt.row{flex-direction:row;align-items:stretch;border-radius:12px}
.vt.row .vt-screen{flex:none;width:36%;max-width:168px;min-height:88px;aspect-ratio:auto}
.vt.row .vt-play{width:38px;height:38px}
.vt.row .vt-badges{left:6px;top:6px;right:6px}
.vt.row .vt-badges .vb+.vb{display:none}
.vt.row .vt-body{align-content:center;padding:8px 12px}
.vt.row .vt-title{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vt.row .vt-note{display:none}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vsearch{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-3)}

/* À la une */
.topcard{display:grid;grid-template-columns:1fr;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:20px}
.top-media{padding:12px 12px 0}
.top-media .vt{border:0;background:transparent}
.top-media .vt-screen{border-radius:12px}
.top-media .vt-play{width:74px;height:74px}
.top-media .vt-body{padding:10px 4px 0}
.top-body{display:grid;gap:10px;min-width:0;padding:16px 18px 18px}
.top-title{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(24px,5.4vw,32px);line-height:1.15;text-wrap:balance}
@media (min-width:900px){.topcard{grid-template-columns:1.15fr 1fr}.top-media{padding:14px}.top-body{align-content:center;padding:22px 24px 22px 8px}}

/* Résumé par catégorie */
.catgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.catgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catcard{display:grid;align-content:start;gap:8px;min-width:0;padding:14px 16px;text-align:left;border-radius:16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.catcard:hover{border-color:var(--accent)}
.cc-head{display:flex;align-items:center;gap:8px;color:var(--accent-ink)}
.cc-label{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.cc-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.cc-sum{font-size:15px;line-height:1.5;color:var(--ink-2)}
.cc-dots{display:flex;gap:5px}

/* Concept, agenda, méthode */
.concept,.method{padding:20px 18px;border-radius:20px;border:1px solid var(--rule);background:var(--card)}
.concept-title{margin:0 0 12px;font-family:var(--display);font-weight:700;font-size:clamp(22px,4.6vw,28px);line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.concept-grid{display:grid;gap:18px}
@media (min-width:900px){.concept-grid{grid-template-columns:1.4fr 1fr;align-items:start}}
.concept-text p{margin:0 0 12px;max-width:66ch}
.concept-media{display:grid;gap:12px}
.agenda{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.agenda li{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.ag-date{padding-top:3px;font-family:var(--mono);font-size:12.5px;color:var(--accent-ink)}
.ag-body{display:grid;gap:2px;min-width:0}
.ag-body b{font-weight:600}
.ag-body span{font-size:15px;color:var(--ink-2)}
.ag-src{padding:4px;color:var(--ink-3)}
.levels{display:grid;gap:10px;margin:0 0 18px;padding:0;list-style:none}
.lvrow{display:grid;grid-template-columns:136px 1fr;align-items:start;gap:12px}
.lvrow .ev{justify-self:start}
.lvrow>span:last-child{font-size:15.5px;color:var(--ink-2)}
@media (max-width:480px){.lvrow{grid-template-columns:1fr;gap:4px}}
.method-cols{display:grid;gap:16px}
@media (min-width:760px){.method-cols{grid-template-columns:1fr 1fr}}
.method h3{margin:0 0 8px;font-family:var(--display);font-size:15px}
.ticks{display:grid;gap:6px;margin:0;padding-left:18px;font-size:15.5px;color:var(--ink-2)}
.foot{padding-block:28px 12px;font-size:14px;color:var(--ink-3)}
.foot p{max-width:76ch;margin:0 0 8px}
.foot-meta{font-family:var(--mono);font-size:12px}

/* Fiche détaillée */
.sheet-backdrop{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-end;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:800px;height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{position:sticky;top:0;z-index:3;padding-top:env(safe-area-inset-top,0px);background:var(--paper);border-bottom:1px solid var(--rule)}
.sheet-head .in{display:flex;align-items:center;gap:10px;min-height:58px}
.sheet-date{margin-right:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sheet-h{margin:0 auto 0 0;font-family:var(--display);font-size:18px}
@media (min-width:860px){.sheet-backdrop{align-items:center;padding:24px}.sheet{height:auto;max-height:100%;border-radius:22px;border:1px solid var(--rule);box-shadow:var(--shadow)}.sheet-head{padding-top:0}.pad{padding-left:28px;padding-right:28px}}
.sheet-body{padding-top:14px}
.detail{padding-top:18px}
.detail p{max-width:68ch}
.d-title{margin:0 0 12px;font-family:var(--serif);font-weight:700;font-size:clamp(25px,6vw,34px);line-height:1.14;letter-spacing:-.01em;text-wrap:balance}
.d-sec{margin-top:24px;scroll-margin-top:70px}
.d-sec p{margin:0 0 12px}
.d-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--ink)}
.d-dek{margin:22px 0 0;font-size:19px;line-height:1.5}
.figure{margin:18px 0 0}
/* Comprendre */
.n-intro{margin:0 0 14px;max-width:720px;color:var(--ink-2);font-size:16px}
.lvl-legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.lvl-legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--ink-2)}
.lvl-b{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:12px;flex:none}
.lvl-b.l2{background:var(--l3-soft);color:var(--l3)} .lvl-b.l3{background:var(--l1-soft);color:var(--l1)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0 24px}
.ncard{all:unset;box-sizing:border-box;display:grid;gap:4px;padding:14px 16px;border-radius:16px;border:1px solid var(--rule);background:var(--card);cursor:pointer}
.ncard:hover,.ncard:focus-visible{border-color:var(--accent)}
.ncard b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.ncard span{font-size:14.5px;color:var(--ink-2)}
.n-dom{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:18px}
.n-dom small{display:block;font-weight:500;font-size:13px;color:var(--ink-3)}
.schema{margin:18px 0 0;padding:12px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
.schema svg{display:block;width:100%;height:auto;max-height:360px}
.schema figcaption{margin-top:8px;font-size:13.5px;color:var(--ink-3)}
.schema .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.schema .lt{fill:none;stroke:var(--ink-3);stroke-width:1.2}
.schema .ac{fill:none;stroke:var(--accent);stroke-width:2.4}
.schema .dash{stroke-dasharray:5 4}
.schema .sf{fill:var(--accent-soft)}
.schema .c0{fill:var(--l0)} .schema .c1{fill:var(--accent)} .schema .c2{fill:var(--l2)} .schema .c3{fill:var(--l3)} .schema .c4{fill:var(--l1)}
.schema .mk{fill:var(--ink)} .schema .mka{fill:var(--accent)}
.schema text{font-family:var(--display);font-size:12px;fill:var(--ink-2)}
.schema .tb{font-weight:700;font-size:13px;fill:var(--ink)}
.schema .ts{font-size:10.5px}
.schema .tw{fill:var(--on-accent);font-weight:700;font-size:13px}
.lvl{margin-top:24px;padding:16px;border-radius:16px;border:1px solid var(--rule);background:var(--card)}
.lvl .d-h{margin-bottom:12px}
.lvl1{border-color:var(--accent-soft);background:var(--accent-soft)}
.lvl1 p{font-size:17.5px;line-height:1.55}
.lvl1 .lvl-b{background:var(--card)}
details.lvl summary{cursor:pointer;list-style:none}
details.lvl summary::-webkit-details-marker{display:none}
details.lvl summary .more-hint{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--ink-3)}
details.lvl[open] summary .more-hint{display:none}
.dyk{margin-top:16px;padding:14px 16px;border-radius:14px;border-left:4px solid var(--l2);background:var(--l2-soft);color:var(--ink)}
.dyk b{display:block;margin-bottom:4px;font-family:var(--display)}
.formulas{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.formulas li{display:grid;gap:3px}
.formulas code{justify-self:start;padding:6px 10px;border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:15px}
.formulas span{font-size:13.5px;color:var(--ink-3)}
.exp ol{margin:8px 0 0;padding-left:22px}
.exp li{margin:6px 0}
.n-related{display:flex;flex-wrap:wrap;gap:8px}
.figure img{display:block;width:100%;height:auto;border-radius:14px;background:var(--paper)}
.figure figcaption{margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.card-img{position:relative;display:block;margin:10px 10px 0;border-radius:12px;overflow:hidden;background:var(--paper)}
.img-tag{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:rgba(9,18,32,.72);color:#fff;font-family:var(--display);font-weight:600;font-size:11px}
.card-img img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.d-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:18px 0 0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink-2);padding:8px 14px;min-height:38px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tsize{display:inline-flex;gap:6px;margin-left:auto}
.tsize button{min-width:42px;min-height:38px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}
.detail[data-dmode="sum"] .d-long{display:none}
.detail[data-dmode="long"] .d-sum{display:none}
.d-long p{font-family:var(--serif)}
.keypts{margin:0 0 16px;padding:12px 16px 12px 34px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.keypts li{margin:4px 0}
.d-note{font-size:13px;color:var(--ink-3)}
html[data-tsize="1"]{--ts:1.12} html[data-tsize="2"]{--ts:1.26} html[data-tsize="3"]{--ts:1.42}
.detail .d-sec p,.detail .keypts li,.detail .d-dek{font-size:calc(1em * var(--ts,1))}
.status{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.reviewed{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:12px;color:var(--l4)}
.reviewed.no{color:var(--l2)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.num{display:grid;gap:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.num b{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.num span{font-size:14px;line-height:1.35;color:var(--ink-2)}
.why{padding:14px 16px;border-radius:14px;background:var(--accent-soft)}
.why .d-h{color:var(--accent-ink)}
.why p{margin:0}
.proof-card{display:grid;gap:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.proof-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.proof-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.proof-desc{margin:0;font-size:15px;color:var(--ink-2)}
.proof-note{margin:0;font-size:15.5px}
.su{display:grid;gap:12px;margin-top:12px}
@media (min-width:640px){.su{grid-template-columns:1fr 1fr}}
.su>div{padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}
.su h4{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-family:var(--display);font-size:14px}
.su .ok h4{color:var(--l4)}
.su .ko h4{color:var(--l2)}

.ask{padding:16px;border-radius:16px;border:1px dashed var(--rule);background:var(--card)}

.ask-out p{margin:0 0 10px}
.ask-out ul{margin:0 0 10px;padding-left:20px}
.ask-note{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

/* Listes (catégories, favoris, archives) */
.rows{display:grid;gap:8px;margin:0;padding:0;list-style:none}

.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-radius:14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}

.pill{padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:11px}
.catlist{display:grid;gap:24px}
.catblock{display:grid;gap:10px}
.cb-head{display:flex;align-items:center;gap:12px}

.cb-title h3{margin:0;font-family:var(--display);font-weight:700;font-size:18px}
.cb-sum{margin:0;max-width:72ch;color:var(--ink-2)}
.vlist{display:grid;gap:28px}
.vgroup{display:grid;gap:10px}
.vg-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.vgroup h3{margin:0;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.25}
.novid-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.novid-list li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--card)}

/* Écouter */

.steps{display:grid;gap:10px;margin:0 0 4px;padding-left:22px;font-size:16px;line-height:1.5}

.player{display:grid;gap:12px;padding:20px 18px;border-radius:20px;background:var(--band);color:var(--band-ink)}
.pl-label{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-ink-2)}

.pl-set{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.speeds{display:flex;flex-wrap:wrap;gap:6px}
.player .chip{background:transparent;border-color:var(--band-ink-2);color:var(--band-ink)}
.player .chip[aria-pressed="true"]{background:var(--band-ink);border-color:var(--band-ink);color:var(--band)}
.voice{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--display);font-weight:600;font-size:13px;color:var(--band-ink-2)}

.pl-note{margin:0;font-size:13.5px;color:var(--band-ink-2)}

.mode{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;border-radius:16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}

.mode small{display:block;margin-top:2px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.mode-ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)}

.chap{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.chap.on{border-color:var(--accent);background:var(--accent-soft)}
.chap-n{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.chap-t{min-width:0;font-size:15px;line-height:1.3}
.chap-d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.transcript{display:grid;gap:16px;padding:18px;border-radius:18px;border:1px solid var(--rule);background:var(--card)}
.tr-ch h4{margin:0 0 6px;font-family:var(--display);font-size:14px;color:var(--accent-ink)}
.tr-ch p{margin:0;max-width:70ch;font-size:16.5px;line-height:1.65}
.s{border-radius:4px;transition:background-color .2s ease;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}

/* Mini-lecteur et notifications */
.mini{position:fixed;z-index:35;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.mini-box{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;padding:8px;border-radius:16px;background:var(--band);color:var(--band-ink);box-shadow:var(--shadow);pointer-events:auto}
.mini-play{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--band-ink);color:var(--band);cursor:pointer}
.mini-prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--band-ink-2);transition:width .4s linear}
.mini-info{all:unset;flex:1;min-width:0;display:grid;gap:1px;padding:2px 4px;cursor:pointer}

.mini-info b{overflow:hidden;font-family:var(--serif);font-weight:600;font-size:14.5px;white-space:nowrap;text-overflow:ellipsis}
.mini .iconbtn{background:transparent;border-color:transparent;color:var(--band-ink)}
@media (min-width:1000px){.mini{left:auto;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:440px;padding:0}}
.toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);max-width:min(92vw,520px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:600;font-size:14px;text-align:center;box-shadow:var(--shadow)}
/* Francophonie */
.vb.fr{background:var(--screen-ink);border-color:var(--screen-ink);color:var(--screen);font-weight:500}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,80%);gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;margin:0 -2px;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.hscroll>*{min-width:0;scroll-snap-align:start}
.hscroll .vt{height:100%}
@media (min-width:700px){.hscroll{grid-auto-columns:minmax(250px,31%)}}
.fr-hl-row{display:grid;gap:10px;margin-bottom:14px}
@media (min-width:760px){.fr-hl-row{grid-template-columns:1fr 1fr}}
.fr-mini{display:grid;align-content:start;gap:4px;padding:14px 16px;text-align:left;border-radius:16px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.fr-mini:hover{border-color:var(--accent)}
.fr-mini .kicker{margin:0}
.fr-mini b{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.3}
.fr-head{position:relative;overflow:hidden;isolation:isolate;background:var(--band);color:var(--band-ink)}
.fr-head::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;background:repeating-radial-gradient(circle at 4% 120%,transparent 0 26px,var(--band-2) 26px 27.5px);-webkit-mask-image:linear-gradient(to right,#000,transparent 70%);mask-image:linear-gradient(to right,#000,transparent 70%)}
.fr-head-in{position:relative;z-index:1;padding-block:24px 26px}
.fr-title{margin:8px 0 12px;font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,60px);line-height:1;letter-spacing:-.03em}
.fr-intro{margin:0;max-width:64ch;font-size:17px;color:var(--band-ink)}
.fr-jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fr-jump a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--band-ink-2);color:var(--band-ink);font-family:var(--display);font-weight:600;font-size:14px;text-decoration:none}
.fr-jump a:hover{border-color:var(--band-ink)}
.hl{display:grid;gap:12px;min-width:0;padding:18px 16px;border-radius:20px;border:1px solid var(--rule);background:var(--card);scroll-margin-top:72px}
.hl+.hl{margin-top:14px}
.hl .kicker{margin:0}
.hl-title{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(22px,5.2vw,29px);line-height:1.18;text-wrap:balance}
.hl-text p{margin:0 0 10px;max-width:68ch}
.hl .nums{margin-top:0}
.hl .srcs{margin:0}
@media (min-width:860px){.hl{padding:22px 24px}}
.frv{display:grid;gap:6px;align-content:start;min-width:0}
.frv .btn{justify-content:flex-start;white-space:normal;text-align:left;line-height:1.25;padding-block:8px}
.ch-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.ch-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.ch-grid{grid-template-columns:repeat(3,1fr)}}
.ch{display:grid;grid-template-columns:auto 1fr;align-content:start;gap:2px 12px;min-width:0;padding:14px;border-radius:16px;border:1px solid var(--rule);background:var(--card)}
.mono{grid-row:span 2;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:15px}
.mono.m-institutions{background:var(--l4-soft);color:var(--l4)}
.mono.m-actu{background:var(--l3-soft);color:var(--l3)}

.ch-name{align-self:end;margin:0;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25}
.ch-who{margin:0;font-size:14px;line-height:1.35;color:var(--ink-3)}
.ch-desc{grid-column:1/-1;margin:8px 0 0;font-size:15px;line-height:1.45;color:var(--ink-2)}

.tag{padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--ink-2);font-family:var(--display);font-weight:600;font-size:11.5px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
(() => {
'use strict';

/* ---------- Référentiels ---------- */
const CATS = [
  { id:'espace',   label:'Espace',                short:'Espace',    icon:'planet' },
  { id:'sante',    label:'Santé',                 short:'Santé',     icon:'heart' },
  { id:'cerveau',  label:'Cerveau & psychologie', short:'Cerveau',   icon:'brain' },
  { id:'physique', label:'Physique & chimie',     short:'Physique',  icon:'atom' },
  { id:'terre',    label:'Terre & climat',        short:'Terre',     icon:'globe' },
  { id:'vivant',   label:'Vivant & nature',       short:'Vivant',    icon:'leaf' },
  { id:'archeo',   label:'Archéologie & paléo',   short:'Passé',     icon:'spiral' },
  { id:'tech',     label:'Tech & IA',             short:'Tech & IA', icon:'chip' },
  { id:'inventions', label:'Inventions',          short:'Inventions', icon:'bulb' }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const CAT_IDS = CATS.map(c => c.id);
const LEVELS = {
  0: { name:'Non évalué',   desc:"Fiche composée automatiquement : le niveau de preuve n'a pas été évalué. Pour juger de la solidité du résultat, ouvre la source." },
  4: { name:'Établi',       desc:"Fait mesuré directement ou consensus scientifique : confirmé par plusieurs sources ou équipes indépendantes." },
  3: { name:'Solide',       desc:"Publié dans une revue relue par des pairs, avec des données et une méthode robustes, mais pas encore reproduit de façon indépendante." },
  2: { name:'Préliminaire', desc:"Premiers indices : étude chez l'animal, corrélation, petit échantillon, présentation en congrès ou interprétation à confirmer." },
  1: { name:'Hypothèse',    desc:"Proposition ou modèle théorique, pas encore vérifié par l'expérience ou l'observation." }
};
const KIND = { officielle:'Source officielle', reportage:'Reportage', contexte:'Contexte', tierce:'Chaîne tierce' };
const SRC_KIND = { officiel:'Officiel', presse:'Presse', etude:'Étude originale' };
const TABS = ['aujourdhui','videos','franco','ecouter','categories','comprendre','favoris'];
const NAV_TABS = TABS.filter(x => x !== 'favoris');
const TAB_LABEL = { aujourdhui:"Aujourd'hui", videos:'Vidéos', franco:'Francophonie', ecouter:'Écouter', categories:'Catégories', comprendre:'Comprendre', favoris:'Favoris' };
const TAB_ICON = { aujourdhui:'today', videos:'video', franco:'bubble', ecouter:'headphones', categories:'grid', comprendre:'atom', favoris:'star' };
const TAB_SHORT = { franco:'Franco' };   /* libellés courts de la barre du bas (téléphone) */
const RATES = [0.85, 1, 1.15, 1.3, 1.5];
const APP_URL = (typeof location !== 'undefined' && /^https?:/.test(location.protocol)) ? location.origin + location.pathname : ''; /* adresse de la Matinale */
const UA = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (/Macintosh/.test(UA) && ((typeof navigator !== 'undefined' && navigator.maxTouchPoints) || 0) > 1);
const IS_ANDROID = /Android/i.test(UA);

const $ = (s, r) => (r || document).querySelector(s);

const arr = v => Array.isArray(v) ? v.filter(x => x != null && x !== '') : [];

const reduceMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
/* Typographie française : espaces fines insécables avant ; : ! ? % » et dans les grands nombres. */
function fr(s){
  return String(s == null ? '' : s)
    .replace(/(\d) (?=\d{3}(?!\d))/g, '$1\u202F')
    .replace(/ ([%:;!?»])/g, '\u202F$1')
    .replace(/« /g, '«\u202F');
}
const t = s => esc(fr(s));
function parseISO(d){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)) : null; }
function dayNum(x){ const d = x.getUTCDate(); return d === 1 ? '1er' : String(d); }
function longDate(d){ const x = parseISO(d); return x ? JOURS[x.getUTCDay()] + ' ' + dayNum(x) + ' ' + MOIS[x.getUTCMonth()] + ' ' + x.getUTCFullYear() : ''; }
function shortDate(d){ const x = parseISO(d); return x ? dayNum(x) + ' ' + MOIS_C[x.getUTCMonth()] + ' ' + x.getUTCFullYear() : ''; }
function shortDateNoYear(d){ const x = parseISO(d); return x ? dayNum(x) + ' ' + MOIS_C[x.getUTCMonth()] : ''; }
function stampLabel(iso){ try { const d = new Date(iso); if (isNaN(d)) return ''; return d.toLocaleString('fr-FR', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Paris' }); } catch (e) { return ''; } }

function normalize(d, id){
  const ed = Object.assign({}, d || {});
  ed.date = (d && d.date) || id;
  ed.items = arr(d && d.items).filter(x => x && x.id && x.title).map(x => Object.assign({}, x, {
    key: ed.date + ':' + x.id,
    cat: CAT_IDS.includes(x.cat) ? x.cat : 'tech',
    videos: arr(x.videos).filter(v => v && isHttp(v.url)),
    sources: arr(x.sources).filter(s => s && isHttp(s.url)),
    evidence: x.evidence || {},
    numbers: arr(x.numbers).filter(n => n && n.v),
    body: Array.isArray(x.body) ? arr(x.body) : (x.body ? [x.body] : []),
    sure: arr(x.sure), unsure: arr(x.unsure),
    detail: arr(x.detail), keyPoints: arr(x.keyPoints), notions: arr(x.notions).filter(v => typeof v === 'string'),
    image: (x.image && typeof x.image.src === 'string' && /^img\/[\w\/.-]+$/.test(x.image.src)) ? x.image : null
  }));
  ed.items.sort((a, b) => CAT_IDS.indexOf(a.cat) - CAT_IDS.indexOf(b.cat));
  ed.categories = (d && d.categories) || {};
  ed.agenda = arr(d && d.agenda);
  ed.podcast = (d && d.podcast) || {};
  return ed;
}
function itemByKey(key){
  if (!key) return null;
  const i = key.indexOf(':'); const date = key.slice(0, i), id = key.slice(i + 1);
  const ed = S.editions.get(date); if (!ed) return null;
  return ed.items.find(x => x.id === id) || null;
}
function lvl(it){ const v = it && it.evidence && it.evidence.level; if (v === 0 || v === '0') return 0; const n = Number(v); return [1,2,3,4].includes(n) ? n : 2; }
function bars(n){ return [1,2,3,4].map(k => '<i class="' + (k <= n ? 'on' : '') + '"></i>').join(''); }
function evHTMLn(n, big){ n = [0,1,2,3,4].includes(n) ? n : 2; return '<span class="ev lv' + n + (big ? ' big' : '') + '" title="' + esc(LEVELS[n].desc) + '"><span class="bars">' + bars(n) + '</span>' + esc(LEVELS[n].name) + '</span>'; }
const evHTML = it => evHTMLn(lvl(it));
function catSummary(ed, id){ const v = ed.categories && ed.categories[id]; return typeof v === 'string' ? v : (v && v.summary) || ''; }
function countVideos(ed){ return ed.items.reduce((a, i) => a + i.videos.length, 0) + arr(ed.concept && ed.concept.videos).filter(v => v && isHttp(v.url)).length + arr(ed.francophonie && ed.francophonie.videos).filter(v => v && isHttp(v.url) && !v.item).length; }

/* ---------- Francophonie ---------- */
const shorten = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; };
const hlVideos = h => arr(h && h.videos).filter(v => v && isHttp(v.url));
function frHighlights(ed){ return arr(ed && ed.francophonie && ed.francophonie.highlights).filter(h => h && h.id && h.title); }
function frVideos(ed){
  const out = [], seen = new Set();
  const add = (v, extra) => { if (!v || !isHttp(v.url) || !isFr(v) || seen.has(v.url)) return; seen.add(v.url); out.push(Object.assign({ v }, extra || {})); };
  if (!ed) return out;
  frHighlights(ed).forEach(h => hlVideos(h).forEach(v => add(v, { hl: h.id, hlTitle: h.title })));
  arr(ed.francophonie && ed.francophonie.videos).forEach(v => add(v, { key: v.item ? ed.date + ':' + v.item : null }));
  ed.items.forEach(it => it.videos.forEach(v => add(v, { key: it.key })));
  return out;
}
function frStripHTML(ed){

function initials(n){
  const w = String(n || '').replace(/[^0-9A-Za-zÀ-ÖØ-öø-ÿŒœ\s'’-]/g, ' ').split(/[\s'’-]+/).filter(x => x && !/^(le|la|les|l|de|du|des|d|et|dr)$/i.test(x));

/* ---------- Podcast : construction des émissions ---------- */
function itemFullAudio(it){
  const ev = it.evidence || {}, parts = [it.title + '.', it.dek].concat(arr(it.detail).length ? arr(it.detail) : arr(it.body));
  if (it.why) parts.push("Pourquoi c'est important : " + it.why);
  parts.push('Niveau de preuve : ' + LEVELS[lvl(it)].name + '.' + (ev.note ? ' ' + ev.note : ''));
  if (arr(it.sure).length) parts.push('Ce qui est établi : ' + arr(it.sure).join(' '));
  if (arr(it.unsure).length) parts.push('Ce qui reste à prouver : ' + arr(it.unsure).join(' '));
  return parts.filter(Boolean).join(' ');
}
function itemAudio(it){ return it.audio || [it.title + '.', it.dek].concat(it.body, ['Niveau de preuve : ' + LEVELS[lvl(it)].name + '.']).join(' '); }
function conceptAudio(c){ return c.audio || ['Le concept du jour : ' + c.title + '.'].concat(arr(c.text)).join(' '); }
function buildChapters(mode, ed, cat){
  if (!ed) return [];
  const Pd = ed.podcast || {}; const items = ed.items; const ch = []; const dt = longDate(ed.date);
  if (mode === 'flash'){
    ch.push({ title:'Ouverture', text: Pd.flashIntro || ('Bonjour, voici le flash de la Matinale des sciences du ' + dt + '.') });
    items.forEach(it => ch.push({ key: it.key, title: it.title, text: it.flash || it.dek || it.title }));
    ch.push({ title:'Clôture', text: Pd.flashOutro || "Les détails, les vidéos et les sources sont dans l'application. Belle journée !" });
  } else if (mode === 'full'){
    ch.push({ title:'Ouverture', text: Pd.intro || ('Bonjour et bienvenue dans la Matinale des sciences du ' + dt + '.') });
    items.forEach(it => ch.push({ key: it.key, title: it.title, text: itemAudio(it) }));
    if (ed.concept && ed.concept.title) ch.push({ title:'Le concept du jour', text: conceptAudio(ed.concept) });
    const fh = frHighlights(ed).filter(h => h.audio);
    if (fh.length) ch.push({ title:'Francophonie', text: [Pd.franco || 'Place à la francophonie.'].concat(fh.map(h => h.audio)).join(' ') });
    ch.push({ title:'Clôture', text: Pd.outro || "C'est la fin de cette édition. Rendez-vous demain matin pour de nouvelles découvertes." });
  } else if (mode === 'cat'){
    const c = CAT[cat]; const its = items.filter(i => i.cat === cat); if (!c || !its.length) return [];
    ch.push({ title: c.label, text: 'Les nouvelles de la catégorie ' + c.label + ', dans la Matinale des sciences du ' + dt + '.' });
    its.forEach(it => ch.push({ key: it.key, title: it.title, text: itemAudio(it) }));
  } else if (mode === 'concept'){
    if (ed.concept && ed.concept.title) ch.push({ title:'Le concept du jour', text: conceptAudio(ed.concept) });
  } else if (mode === 'franco'){
    frHighlights(ed).forEach(h => ch.push({ title: h.title, text: h.audio || arr(h.text).join(' ') }));
  }
  return ch.filter(c => c.text && String(c.text).trim());
}
function speechify(s){
  return String(s || '')
    .replace(/≈\s?/g, 'environ ').replace(/×\s?/g, 'fois ').replace(/&/g, ' et ')
    .replace(/km²/g, ' kilomètres carrés').replace(/km\/h/g, ' kilomètres à l’heure')
    .replace(/10⁻¹⁵/g, 'dix puissance moins quinze')
    .replace(/\s[–—]\s/g, ', ').replace(/[«»]/g, '').replace(/\s+/g, ' ').trim();
}
function splitSentences(text){
  const s = String(text || '').replace(/\s+/g, ' ').trim(); if (!s) return [];
  let parts = null;
  if (window.Intl && Intl.Segmenter){ try { parts = Array.from(new Intl.Segmenter('fr', { granularity:'sentence' }).segment(s), x => x.segment.trim()).filter(Boolean); } catch (e) { parts = null; } }
  if (!parts || !parts.length) parts = (s.match(/[^.!?…]+[.!?…]+["»)]*|[^.!?…]+$/g) || [s]).map(x => x.trim()).filter(Boolean);
  const out = [];
  parts.forEach(p => {
    if (p.length <= 200){ out.push(p); return; }
    let cur = '';
    p.replace(/([,;:])\s+/g, '$1\u0000').split('\u0000').forEach(seg => {
      if (cur && (cur + ' ' + seg).length > 200){ out.push(cur.trim()); cur = seg; } else cur = cur ? cur + ' ' + seg : seg;
    });
    if (cur.trim()) out.push(cur.trim());
  });
  return out;
}
function estMin(chs){ const n = chs.reduce((a, c) => a + splitSentences(speechify(c.text)).reduce((x, s) => x + s.length, 0), 0); return Math.max(1, Math.round(n / CPS / 60)); }
function fmtDur(chars){ const sec = chars / (CPS * (S.prefs.rate || 1)); return sec < 60 ? '< 1 min' : Math.round(sec / 60) + ' min'; }

/* ---------- Podcast : lecteur (synthèse vocale) ---------- */
const Player = {
  synth: ('speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function') ? window.speechSynthesis : null,
  chapters:[], sents:[], lens:[], totalChars:0, ci:0, si:0, playing:false, started:false, done:false,
  token:0, label:'', mode:null, edDate:null, wake:null, voices:[],
  engine:'tts', seg:null, au:null, lastUI:0, _ci:-1,
  load(mode, chapters, label, edDate, seg){
    this.stop();
    this.engine = seg ? 'file' : 'tts'; this.seg = seg || null;
    this.mode = mode; this.label = label || ''; this.edDate = edDate || null; this.chapters = chapters;
    this.sents = chapters.map(c => splitSentences(speechify(c.text)));
    this.lens = this.sents.map(a => a.map(x => x.length));
    this.totalChars = this.lens.reduce((a, l) => a + l.reduce((x, y) => x + y, 0), 0);
    this.ci = 0; this.si = 0; this.done = false;
  },
  chapterChars(i){ return (this.lens[i] || []).reduce((x, y) => x + y, 0); },
  doneChars(){ let n = 0; for (let i = 0; i < this.ci && i < this.lens.length; i++) n += this.chapterChars(i); const cur = this.lens[this.ci] || []; for (let j = 0; j < this.si && j < cur.length; j++) n += cur[j]; return n; },
  /* Lecture d'un enregistrement (fichier audio) : fonctionne partout, même sans voix de synthèse. */
  audioEl(){
    if (this.au) return this.au;
    const au = new Audio(); au.preload = 'auto';
    au.addEventListener('timeupdate', () => this.onTime());
    au.addEventListener('ended', () => { if (this.engine === 'file') this.finish(); });
    au.addEventListener('pause', () => { if (this.engine === 'file' && this.playing && !au.ended){ this.playing = false; this.unlock(); updatePlayerUI(); } });
    au.addEventListener('play', () => { if (this.engine === 'file' && !this.playing){ this.playing = true; this.started = true; updatePlayerUI(); } });
    au.addEventListener('error', () => { if (this.engine === 'file' && this.started) this.fileFailed(); });
    this.au = au; return au;
  },
  playFile(){
    const seg = this.seg; if (!seg || !this.chapters.length) return;
    const au = this.audioEl();
    if (this.done){ this.ci = 0; this.si = 0; this.done = false; }
    let abs = seg.src; try { abs = new URL(seg.src, location.href).href; } catch (e) {}
    if (au.src !== abs) au.src = seg.src;
    const ch = this.chapters[this.ci] || this.chapters[0];
    const cur = au.currentTime || 0;
    if (!(cur >= ch.start - 0.3 && cur < ch.end)){ try { au.currentTime = ch.start; } catch (e) {} }
    try { au.playbackRate = S.prefs.rate || 1; } catch (e) {}
    this.playing = true; this.started = true;
    const tk = this.token, from = au.currentTime || 0;
    setTimeout(() => { if (tk === this.token && this.engine === 'file' && this.playing && this.au === au && au.readyState < 3 && Math.abs((au.currentTime || 0) - from) < 0.05) this.fileFailed(); }, 10000);
    let p; try { p = au.play(); } catch (e) { p = null; this.fileFailed(); return; }
    if (p && p.catch) p.catch(err => {
      this.playing = false; updatePlayerUI();
      if (err && err.name === 'NotAllowedError') toast("Touche Lecture pour démarrer l'écoute."); else if (!(err && err.name === 'AbortError')) this.fileFailed();
    });
    this.lock(); updatePlayerUI();
  },
  fileFailed(){
    this.playing = false; this.unlock(); updatePlayerUI();
    if (this.synth){
      toast("L'enregistrement ne se charge pas : la voix du téléphone prend le relais.");
      const ed = S.edition; const chs = this.chapters.map(c => ({ key: c.key ? (ed && ed.date) + ':' + c.key : undefined, title: c.title, text: c.text }));
      const ci = this.ci; this.load(this.mode, chs, this.label, this.edDate, null); this.ci = Math.min(ci, chs.length - 1); this.play(); return;
    }
    openListenElsewhere();
  },
  onTime(){
    if (this.engine !== 'file' || !this.au || !this.chapters.length) return;
    const t = this.au.currentTime || 0, chs = this.chapters;
    let c = chs[this.ci];
    if (c && this.playing && t >= c.end - 0.05){
      if (this.ci < chs.length - 1){ this.ci++; this.si = 0; const nx = chs[this.ci]; if (Math.abs(t - nx.start) > 1.2){ try { this.au.currentTime = nx.start; } catch (e) {} } }
      else { try { this.au.pause(); } catch (e) {} this.finish(); return; }
    }

/* ---------- Questions à Claude ---------- */
function inline(s){ return esc(fr(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function mdLite(s){
  const lines = String(s || '').split(/\r?\n/); let html = '', inList = false, para = [];
  const flush = () => { if (para.length){ html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  lines.forEach(raw => {
    const l = raw.trim();
    if (/^[-*•]\s+/.test(l)){ flush(); if (!inList){ html += '<ul>'; inList = true; } html += '<li>' + inline(l.replace(/^[-*•]\s+/, '')) + '</li>'; }
    else if (!l){ flush(); if (inList){ html += '</ul>'; inList = false; } }
    else { if (inList){ html += '</ul>'; inList = false; } para.push(l.replace(/^#+\s*/, '')); }
  });
  flush(); if (inList) html += '</ul>';
  return html;
}
async function ask(q){
  const it = itemByKey(S.detailKey); const out = $('#ask-out');
  if (!S.sample || !it || !out || !q) return;
  if (S.askCtl){ try { S.askCtl.abort(); } catch (e) {} }
  const ctl = new AbortController(); S.askCtl = ctl;
  out.hidden = false; out.innerHTML = '<p class="muted">Claude réfléchit…</p>';
  const ev = it.evidence || {};
  const fiche = { titre:it.title, chapo:it.dek, resume:it.body, pourquoi_c_est_important:it.why || null, ce_qui_est_etabli:it.sure, ce_qui_reste_a_prouver:it.unsure, chiffres_cles:it.numbers,
    niveau_de_preuve:LEVELS[lvl(it)].name, type_d_etude:ev.type || null, statut:ev.status || null, note_sur_la_preuve:ev.note || null,
    revue:it.journal || null, date:dateLabel(it), institutions:it.who || null, conflits_d_interets:it.coi || null, sujet_de_sante:!!it.health };
  const prompt = "Tu es le rédacteur scientifique de l'application « Matinale des Sciences ». Réponds en français, en 180 mots maximum, de façon claire et exacte, sans jargon inutile. Utilise des paragraphes courts, et une liste à puces seulement si elle aide.\n\n" +
    "Règles :\n- Appuie-toi d'abord sur la fiche ci-dessous. Tu peux ajouter des connaissances scientifiques générales bien établies, mais n'invente aucun chiffre, aucune étude, aucun nom et aucune source.\n" +
    "- Si la fiche ne permet pas de répondre, dis-le simplement.\n- Respecte le niveau de preuve indiqué : ne présente jamais un résultat préliminaire comme une certitude, et ne confonds pas corrélation et cause.\n" +
    "- Pour un sujet de santé, ne donne aucun conseil médical personnel et rappelle de consulter un professionnel si la question le justifie.\n\n" +
    "FICHE (JSON) :\n" + JSON.stringify(fiche) + "\n\nQUESTION : " + q;
  try {
    const r = await S.sample(prompt, { signal: ctl.signal, onText: u => { if (S.askCtl === ctl) out.innerHTML = mdLite(u.text); } });
    if (S.askCtl !== ctl) return;
    out.innerHTML = mdLite(r.text) + (r.truncated ? '<p class="muted small">Réponse coupée : pose une question plus précise.</p>' : '') + '<p class="ask-note">Réponse générée par Claude à partir de la fiche. Vérifie toujours dans les sources.</p>';
  } catch (e) {
    if (S.askCtl !== ctl) return;
    const code = e && e.code;
    if (code === 'cancelled') return;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ out.innerHTML = '<p class="muted">Les questions à Claude ne sont pas disponibles ici.</p>'; S.sample = null; return; }
    const msg = code === 'rate_limited' ? "Trop de questions d'un coup : réessaie dans quelques minutes."
      : code === 'session_expired' ? 'Ta session a expiré : reconnecte-toi à Claude.'
      : code === 'refused' ? "Claude n'a pas pu répondre à cette question. Essaie de la reformuler."
      : 'La réponse a été interrompue. Réessaie dans un instant.';
    out.innerHTML = (e && e.text && code !== 'refused' ? mdLite(e.text) : '') + '<p class="muted">' + esc(msg) + '</p>';
  }
}

}
function openNotion(id){
  const n = notionById(id); if (!n){ if (S.bases && S.bases !== 'error') toast('Notion introuvable.'); return; }
  const dom = arr(S.bases.domains).find(d => d.id === n.domain) || {};
  const svg = typeof n.svg === 'string' && n.svg.startsWith('<svg') ? n.svg : '';
  const news = newsForNotion(id);
  const html = '<div class="sheet-head"><div class="in pad"><span class="cat-tag">' + icon('atom', 16) + esc('Comprendre · ' + (dom.label || '')) + '</span><button class="iconbtn" style="margin-left:auto" data-action="close" aria-label="Fermer">' + icon('close') + '</button></div></div>' +
    '<article class="detail pad notion"><h2 class="d-title">' + t(n.title) + '</h2><p class="d-dek">' + t(n.tagline || '') + '</p>' +
    (svg ? '<figure class="schema">' + svg + (n.caption ? '<figcaption>' + t(n.caption) + '</figcaption>' : '') + '</figure>' : '') +
    '<div class="d-tools"><button class="btn sm" data-action="load" data-mode="notion" data-id="' + esc(id) + '">' + icon('headphones', 16) + ' Écouter</button><div class="tsize" role="group" aria-label="Taille du texte"><button data-action="tsize" data-d="-1" aria-label="Texte plus petit">A−</button><button data-action="tsize" data-d="1" aria-label="Texte plus grand">A+</button></div></div>' +
    '<section class="d-sec lvl lvl1"><h3 class="d-h"><i class="lvl-b">1</i> Pour tous, dès 10 ans</h3>' + arr(n.kid).map(p => '<p>' + t(p) + '</p>').join('') + '</section>' +
    (n.dyk ? '<div class="dyk"><b>Le savais-tu ?</b>' + t(n.dyk) + '</div>' : '') +
    '<section class="d-sec lvl"><h3 class="d-h"><i class="lvl-b l2">2</i> Pour aller plus loin</h3>' + arr(n.more).map(p => '<p>' + t(p) + '</p>').join('') + '</section>' +
    '<details class="d-sec lvl"><summary class="d-h"><i class="lvl-b l3">3</i> Niveau ingénieur<span class="more-hint">formules et ordres de grandeur ›</span></summary>' +
      arr(n.expert).map(p => '<p>' + t(p) + '</p>').join('') +
      (arr(n.formulas).length ? '<ul class="formulas">' + n.formulas.map(f => '<li><code>' + esc(f.f) + '</code><span>' + t(f.l || '') + '</span></li>').join('') + '</ul>' : '') + '</details>' +
    (arr(n.numbers).length ? '<div class="nums">' + n.numbers.map(x => '<div class="num"><b>' + t(x.v) + '</b><span>' + t(x.l || '') + '</span></div>').join('') + '</div>' : '') +
    (n.exp && arr(n.exp.steps).length ? '<section class="d-sec lvl exp"><h3 class="d-h">' + icon('quest', 18) + ' À essayer chez soi : ' + t(n.exp.title || '') + '</h3><ol>' + n.exp.steps.map(x => '<li>' + t(x) + '</li>').join('') + '</ol>' + (n.exp.safety ? '<div class="caution">' + icon('alert', 18) + '<p>' + t(n.exp.safety) + '</p></div>' : '') + '</section>' : '') +
    (news.length ? '<section class="d-sec"><h3 class="d-h">' + icon('doc', 18) + ' Dans l\'actualité</h3><ul class="rows">' + news.map(rowHTML).join('') + '</ul></section>' : '') +
    (arr(n.related).length ? '<section class="d-sec"><h3 class="d-h">Notions liées</h3><div class="n-related">' + n.related.map(r => notionById(r)).filter(Boolean).map(r => '<button class="chip" data-action="notion" data-id="' + esc(r.id) + '">' + icon('atom', 14) + ' ' + t(r.title) + '</button>').join('') + '</div></section>' : '') +
    '<div class="d-actions"><button class="btn" data-action="share-notion" data-id="' + esc(id) + '">' + icon('share', 18) + ' Partager</button></div></article>';
  showSheet(html, n.title);
}
function fillNotionSlot(){
  const el = $('#n-slot'); if (!el) return;
  const ns = String(el.dataset.ids || '').split(',').map(notionById).filter(Boolean);
  if (!ns.length){ el.remove(); return; }
  el.innerHTML = '<h3 class="d-h">' + icon('atom', 18) + ' Pour comprendre</h3><div class="n-related">' + ns.map(n => '<button class="chip" data-action="notion" data-id="' + esc(n.id) + '">' + t(n.title) + '</button>').join('') + '</div>';
}
function shareNotion(id){
  const n = notionById(id); if (!n || !APP_URL) return;
  const url = APP_URL + '#n=' + encodeURIComponent(id);
  const data = { title: fr(n.title), text: fr(n.title) + ' · Comprendre, La Matinale des Sciences', url };
  if (navigator.share){ navigator.share(data).catch(() => {}); } else copyText(url);
}
/* Partage d'une fiche : le lien ouvre directement cette fiche dans la Matinale. */
function shareItem(key){
  const it = itemByKey(key); if (!it || !APP_URL) return;
  const url = APP_URL + '#f=' + encodeURIComponent(key);
  const data = { title: fr(it.title), text: fr(it.title) + ' · La Matinale des Sciences', url };
  if (navigator.share){ navigator.share(data).catch(() => {}); } else copyText(url);
}
function openPending(){
  const key = S.pendingKey; if (!key || S.status !== 'ready') return;
  if (itemByKey(key)){ S.pendingKey = null; openDetail(key); return; }
  const date = key.split(':')[0];
  if (S.pendingTried || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  S.pendingTried = true;
  fetchEdition(date).then(ed => {
    const k = S.pendingKey; S.pendingKey = null;
    if (ed && itemByKey(k)) openDetail(k); else toast('Cette fiche n\'est plus disponible.');
  }).catch(() => { S.pendingKey = null; });
}
function copyText(txt){
  if (!txt) return;
  const fail = () => toast('Copie impossible ici. Lien : ' + txt);
  try { navigator.clipboard.writeText(txt).then(() => toast('Lien copié'), fail); } catch (e) { fail(); }
}
function onClick(e){
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  switch (act){
    case 'tab': e.preventDefault(); if (S.sheetOpen) closeSheet(); setTab(a.dataset.tab); break;
    case 'open': openDetail(a.dataset.key, a.dataset.focus); break;
    case 'open-fav': openFav(a.dataset.key); break;
    case 'close': closeSheet(); break;
    case 'fav': toggleFav(a.dataset.key); break;
    case 'dmode': { const m = a.dataset.m === 'long' ? 'long' : 'sum'; LS.set('mds.dmode', m); const art = a.closest('.detail'); if (art){ art.dataset.dmode = m; $$('.seg button', art).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m))); } break; }
    case 'tsize': { const v = Math.max(0, Math.min(3, Number(LS.get('mds.tsize', 0)) + Number(a.dataset.d))); LS.set('mds.tsize', v); applyTsize(); break; }
    case 'off-on': LS.set('offlineAudio', true); gardeAudio(); break;
    case 'off-off': LS.set('offlineAudio', false); S.offBusy = false; swSend({ type:'audio-effacer' }); break;
    case 'load': startMode(a.dataset.mode, { cat:a.dataset.cat, key:a.dataset.key, hl:a.dataset.hl, id:a.dataset.id }); break;
    case 'notion': openNotion(a.dataset.id); break;
    case 'share-notion': shareNotion(a.dataset.id); break;
    case 'bases-retry': S.bases = null; S.basesP = null; renderComprendre(); break;
    case 'fr-filter': S.frGroup = a.dataset.g || 'all'; renderDir(); break;
    case 'vid-filter': S.vidFilter = a.dataset.f === 'fr' ? 'fr' : 'all'; renderVideos(); break;
    case 'jump': { e.preventDefault(); const target = document.getElementById(a.dataset.target || ''); if (target) target.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); break; }
    case 'goto-hl': {
      if (S.sheetOpen) closeSheet();
      if (S.tab !== 'franco') setTab('franco', { scroll:false });
      requestAnimationFrame(() => { const h = document.getElementById('hl-' + (a.dataset.hl || '')); if (h) h.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); else window.scrollTo(0, 0); });
      break;
    }
    case 'toggle': if (!Player.chapters.length) startMode('full'); else Player.toggle(); break;
    case 'next': Player.next(); break;
    case 'prev': Player.prev(); break;
    case 'stop': Player.stop(); Player.started = false; updatePlayerUI(); break;
    case 'chapter': Player.jump(Number(a.dataset.ci)); break;
    case 'rate': S.prefs.rate = Number(a.dataset.rate) || 1; savePrefs(); renderChapters(); Player.restartSentence(); updatePlayerUI(); break;
    case 'filter-cat': S.filterCat = a.dataset.cat || 'all'; renderFeed(); break;
    case 'filter-lvl': { const n = Number(a.dataset.lvl); S.filterLvl = S.filterLvl === n ? 0 : n; renderFeed(); break; }
    case 'clear-filters': { S.filterCat = 'all'; S.filterLvl = 0; S.query = ''; const q = $('#q'); if (q) q.value = ''; renderFeed(); break; }
    case 'see-cat': {
      S.filterCat = a.dataset.cat || 'all'; S.filterLvl = 0;
      if (S.tab !== 'aujourdhui') setTab('aujourdhui', { scroll:false }); else renderFeed();
      requestAnimationFrame(() => { const f = $('#feed-sec'); if (f) f.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); });
      break;
    }
    case 'goto-method': { e.preventDefault(); const m = $('#methode'); if (m) m.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); break; }
    case 'archive': openArchive(); break;
    case 'load-edition': loadEdition(a.dataset.date); break;
    case 'latest': if (S.latest){ S.edition = S.latest; S.followLatest = true; S.filterCat = 'all'; S.filterLvl = 0; S.query = ''; renderAll(); window.scrollTo(0, 0); } break;
    case 'ask': ask(a.dataset.q); break;
    case 'copy': copyText(a.dataset.text); break;
    case 'share': shareItem(a.dataset.key); break;
    case 'install-help': openInstallHelp(); break;
    case 'install-now': installNow(); break;
    case 'install-done': LS.set('mds.install', 'done'); renderToday(); toast('Parfait, bonne lecture !'); break;
    case 'install-later': LS.set('mds.install', Date.now() + 7 * 864e5); renderToday(); break;
    case 'reload': if (S.status === 'ready') { try { location.reload(); } catch (err) { checkUpdate(); } } else { toast('Nouvelle tentative…'); fbPromise = null; loadFallback(true); loadAudioIndex(); } break;
  }
}
function bindEvents(){
  $('#tabbar').innerHTML = NAV_TABS.map(x => '<button data-action="tab" data-tab="' + x + '" aria-current="false">' + icon(TAB_ICON[x], 22) + '<span>' + esc(TAB_SHORT[x] || TAB_LABEL[x]) + '</span></button>').join('');
  $('#hdr-fav').innerHTML = icon('star', 19);
  $('#mini-next').innerHTML = icon('next', 20); $('#mini-stop').innerHTML = icon('close', 20);
  document.addEventListener('input', e => { if (e.target && e.target.id === 'fq'){ S.frQuery = e.target.value; renderDir(); } if (e.target && e.target.id === 'nq'){ S.nq = e.target.value; renderNotionList(); } });
  document.addEventListener('click', onClick);
  document.addEventListener('submit', e => { if (e.target && e.target.id === 'ask-form'){ e.preventDefault(); const inp = $('#ask-input'); const v = inp ? inp.value.trim() : ''; if (v) ask(v); } });
  document.addEventListener('input', e => { if (e.target && e.target.id === 'q'){ S.query = e.target.value; renderFeed(); } });
  document.addEventListener('change', e => { if (e.target && e.target.id === 'voice-select'){ S.prefs.voiceURI = e.target.value || null; savePrefs(); Player.restartSentence(); } });
  document.addEventListener('keydown', e => { if (!S.sheetOpen) return; if (e.key === 'Escape') closeSheet(); else if (e.key === 'Tab') trapFocus(e); });
  $('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (TABS.includes(h) && h !== S.tab) setTab(h); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Player.playing) Player.lock(); });
  window.addEventListener('pagehide', () => Player.stop());
  if (Player.synth){ loadVoices(); try { Player.synth.addEventListener('voiceschanged', loadVoices); } catch (e) { Player.synth.onvoiceschanged = loadVoices; } }
}

/* ---------- Données ---------- */
function subscribe(){
  try {
    S.db.collection('editions').orderBy('date', 'desc').limit(1).onSnapshot(snap => {
      if (!snap.docs.length){ if (!S.latest){ S.status = 'empty'; renderAll(); loadFallback(false); } return; }
      const doc = snap.docs[0]; const ed = normalize(doc.data(), doc.id);
      S.editions.set(ed.date, ed); S.latest = ed;
      if (!S.edition || S.followLatest || S.fallback || S.edition.date === ed.date) S.edition = ed;
      S.fallback = false; S.status = 'ready'; renderAll();
    }, () => { if (!S.latest){ S.status = 'error'; renderAll(); } loadFallback(false); });
  } catch (e) { S.status = 'error'; renderAll(); loadFallback(false); }
  try {
    S.db.collection('archive').orderBy('date', 'desc').limit(120).onSnapshot(snap => {
      S.archive = snap.docs.map(d => Object.assign({ date:d.id }, d.data()));
    }, () => {});
  } catch (e) {}
  try {
    S.db.doc('refs/francophonie').onSnapshot(snap => {
      S.franco = snap.exists ? (snap.data() || null) : null;
      if (S.tab === 'franco') renderFranco();
    }, () => {});
  } catch (e) {}
}
/* Secours : si la base de l'application est indisponible ou lente, on lit la copie publiée avec la page. */
let fbPromise = null;
function loadFallback(final){
  if (S.status === 'ready' && !S.fallback) return;
  if (!fbPromise){
    fbPromise = fetch('data/latest.json', { cache:'no-store' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); S.copie = r.headers.get('X-Matinale-Copie') === '1'; return r.json(); })
      .then(d => {
        const raw = d && d.edition;
        const ed = normalize(raw, raw && raw.date);
        if (!ed.items.length) throw new Error('copie vide');
        return { ed, refs: (d && d.refs) || null, archive: arr(d && d.archive).filter(a => a && a.date) };
      });
  }
  fbPromise.then(x => {
    if (S.status === 'ready' && !S.fallback) return;
    S.editions.set(x.ed.date, x.ed); S.latest = x.ed; S.edition = x.ed; S.fallback = true;
    if (x.refs && !S.franco) S.franco = x.refs;
    if (x.archive.length && !S.archive.length) S.archive = x.archive;
    S.status = 'ready'; renderAll();
    if (S.copie) toast("Pas de réseau : voici la dernière édition gardée dans le téléphone.", 4500);
  }).catch(() => {
    fbPromise = null;
    if (final && S.status !== 'ready'){ S.status = 'nodb'; renderAll(); }
  });
}
function registerSW(){
  try {
    const okHost = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (okHost && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) {}
}
let lastCheck = Date.now();
function checkUpdate(){
  lastCheck = Date.now();
  fetch('data/latest.json', { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(d => {
    const raw = d && d.edition; if (!raw || !raw.date) return;
    const fresh = !S.latest || raw.date > S.latest.date || (raw.date === S.latest.date && raw.updatedAt && raw.updatedAt !== S.latest.updatedAt);
    if (!fresh) return;
    const ed = normalize(raw, raw.date); if (!ed.items.length) return;
    const follow = !S.edition || S.followLatest || !S.latest || S.edition.date === S.latest.date;
    S.editions.set(ed.date, ed); S.latest = ed; if (follow) S.edition = ed;
    if (d.refs) S.franco = d.refs;
    const ar = arr(d.archive).filter(a => a && a.date); if (ar.length) S.archive = ar;
    S.status = 'ready'; S.fallback = true; loadAudioIndex(); renderAll();
    if (follow) toast('Nouvelle édition du ' + shortDateNoYear(ed.date) + ' !');
  }).catch(() => {});
}
function watchUpdates(){
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastCheck > 15 * 60e3) checkUpdate(); });
  window.addEventListener('online', () => checkUpdate());
  try { navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'maj') checkUpdate(); else if (e.data && e.data.type === 'audio-etat') onAudioState(e.data); }); } catch (e) {}
  swSend({ type:'audio-etat' });
}
function applyTsize(){ try { document.documentElement.dataset.tsize = String(Number(LS.get('mds.tsize', 0)) || 0); } catch (e) {} }
function boot(){
  applyTsize();
  bindEvents();
  const h = (location.hash || '').slice(1);
  if (h.startsWith('f=')){ try { S.pendingKey = decodeURIComponent(h.slice(2)); } catch (e) {} }   /* lien partagé vers une fiche */
  let nid = null; if (h.startsWith('n=')){ try { nid = decodeURIComponent(h.slice(2)); } catch (e) {} }   /* lien partagé vers une notion */
  setTab(nid ? 'comprendre' : (TABS.includes(h) ? h : 'aujourdhui'), { scroll:false });
  if (nid) loadBases().then(() => openNotion(nid));
  else setTimeout(() => { loadBases().catch(() => {}); }, 6000);   /* gardée dans le téléphone pour le hors-ligne */
  setTimeout(() => { if (S.status === 'loading') loadFallback(false); }, 4000);
  loadAudioIndex();
  /* Version autonome : ni compte ni base, les fichiers publiés avec le site suffisent. */
  loadFallback(true); registerSW(); watchUpdates(); return;
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function'){ loadFallback(true); return; }
  const userP = cl.use('user');
  cl.use('sample').then(s => { S.sample = typeof s === 'function' ? s : null; const sec = $('#ask-sec'); if (sec) sec.hidden = !S.sample; }).catch(() => {});
  cl.use('db').then(db => {
    if (!db){ loadFallback(true); return; }
    S.db = db; subscribe();
    userP.then(u => { if (!u) return; S.user = u; return Promise.resolve(u.id()).then(id => { S.uid = id || null; if (S.uid) loadPrefs(); }); }).catch(() => {});
  }).catch(() => loadFallback(true));
}
boot();
})();
