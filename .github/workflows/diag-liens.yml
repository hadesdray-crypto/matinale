# Diagnostic : les sites proposés dans l'appli répondent-ils ? Lancé à la main.
name: Diagnostic liens
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-liens.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liens
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36"
          r=""
          for u in https://www.largus.fr/cote/immatriculation/ https://www.oscaro.com/ https://histovec.interieur.gouv.fr/histovec/proprietaire https://carlabelling.ademe.fr/ https://ev-database.org/ https://ev-database.org/fr/; do
            c=$(curl -sS -L -m 25 -A "$UA" -o /tmp/p.html -w "%{http_code} %{url_effective}" "$u"); t=$(grep -o "<title>[^<]*" /tmp/p.html | head -1 | cut -c8-90)
            r="$r | $u → $c [$t]"
          done
          echo "::notice title=Liens::$r"
