# Contrôle ponctuel (lancement manuel uniquement). Écrit le rapport sur la branche « diag ».
name: Contrôle des sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/diag_feeds.py
      - name: Publier le rapport sur la branche diag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan diag
          git rm -rq --cached . ; git add diag
          git commit -q -m "Rapport de contrôle"
          git push -q -f origin diag
