# Matinale des Sciences : met en ligne une nouvelle version de l'appli (page, mode hors ligne, polices, icônes)
# sans refaire l'édition du jour. Se lance tout seul quand ces fichiers changent sur GitHub, ou à la main :
# onglet Actions > Mise en ligne de l'appli > Run workflow. L'édition et l'audio du jour déjà en ligne sont gardés.
name: Mise en ligne de l'appli

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "site/data/bases.json"
      - "scripts/notions_audio.py"
  workflow_dispatch:
    inputs:
      refaire_audio:
        description: "Refaire l'audio du jour (flash, édition complète, fiches) sans refaire l'édition"
        type: boolean
        default: false
      politique:
        description: "Préparer tout de suite la rubrique Politique & monde (et son audio)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matinale
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Garder les outils audio d'un jour sur l'autre
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/matinale-outils
          key: matinale-voix-sherpa-v1.12.14-siwis

      - name: Audio des notions « Comprendre » (seulement pour une notion nouvelle ou modifiée)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if python3 scripts/notions_audio.py --bases site/data/bases.json --out site/audio/notions --check; then exit 0; fi
          . scripts/voice.sh
          if [ "$VOICE_OK" != 1 ]; then echo "::notice::Voix indisponible : les notions seront lues par la voix du téléphone."; exit 0; fi
          python3 scripts/notions_audio.py --bases site/data/bases.json --tts "$TTS" --voice "$VOICE_DIR" --out site/audio/notions || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/audio/notions
          if ! git diff --cached --quiet; then
            git commit -q -m "Audio des notions" && git pull -q --rebase origin main && git push -q || echo "::warning::Audio des notions publié mais pas sauvegardé : il sera refait au prochain passage."
          fi

      - name: Rubrique Politique & monde (à la demande)
        if: ${{ inputs.politique }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p site/data/politique
          python3 scripts/politique.py --site site 2>&1 | tee site/data/politique/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/politique
          if ! git diff --cached --quiet; then git commit -q -m "Politique & monde du $(TZ=Europe/Paris date +%F)" && git pull -q --rebase origin main && git push -q || echo "::warning::Rubrique publiée mais pas sauvegardée."; fi

      - name: Audio de la rubrique Politique & monde
        if: ${{ inputs.politique || inputs.refaire_audio }}
        timeout-minutes: 20
        continue-on-error: true
        run: |
          [ -f site/data/politique/latest.json ] || exit 0
          . scripts/voice.sh
          [ "$VOICE_OK" = 1 ] || exit 0
          python3 scripts/make_audio.py --edition site/data/politique/latest.json --tts "$TTS" --voice "$VOICE_DIR" --out site/audio/politique --prefix audio/politique --modes flash \
            || rm -f site/audio/politique/audio.json

      - name: Refaire l'audio du jour avec la voix française (sans refaire l'édition)
        if: ${{ inputs.refaire_audio }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          . scripts/voice.sh
          if [ "$VOICE_OK" = 1 ] && python3 scripts/make_audio.py --edition site/data/latest.json --tts "$TTS" --voice "$VOICE_DIR" --out site/audio; then
            echo "Audio du jour refait."
          else
            rm -f site/audio/audio.json site/audio/*.mp3; rm -rf site/audio/items
            echo "::warning::Audio non refait : celui déjà en ligne est repris."
          fi

      - name: Reprendre l'audio du jour déjà en ligne
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ ! -f site/audio/politique/audio.json ]; then
            mkdir -p site/audio/politique
            curl -fsSL --retry 3 -o site/audio/politique/audio.json "$base/audio/politique/audio.json" && curl -fsSL --retry 3 -o site/audio/politique/flash.mp3 "$base/audio/politique/flash.mp3" \
              || rm -f site/audio/politique/audio.json site/audio/politique/flash.mp3
          fi
          if [ -f site/audio/audio.json ]; then echo "Audio du jour déjà prêt."; exit 0; fi
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p site/audio
          if curl -fsSL --retry 3 -o site/audio/audio.json "$base/audio/audio.json" \
             && curl -fsSL --retry 3 -o site/audio/flash.mp3 "$base/audio/flash.mp3" \
             && curl -fsSL --retry 3 -o site/audio/full.mp3 "$base/audio/full.mp3"; then
            echo "Audio du jour repris."
          else
            rm -f site/audio/audio.json site/audio/*.mp3
            echo "::notice::Pas d'audio en ligne à reprendre : la voix du téléphone lira l'édition jusqu'au prochain matin."
          fi

      - name: Reprendre les audios par fiche et les images du jour déjà en ligne
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python3 - "$base" <<'PY' || echo "::notice::Audios par fiche ou images non repris : ils reviendront avec la prochaine édition."
          import json, os, sys, urllib.parse, urllib.request
          base = sys.argv[1].rstrip('/')
          def get(rel):
              dest = os.path.join('site', rel)
              if os.path.exists(dest):   # déjà là (audio refait à l'instant) : on garde
                  return True
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              try:
                  with urllib.request.urlopen(base + '/' + urllib.parse.quote(rel), timeout=60) as r, open(dest, 'wb') as f:
                      f.write(r.read())
                  return True
              except Exception:
                  return False
          wanted = []
          for idx in ('site/audio/audio.json', 'site/audio/politique/audio.json'):
              try:
                  audio = json.load(open(idx, encoding='utf-8'))
                  wanted += [i.get('src') for i in (audio.get('items') or {}).values() if isinstance(i, dict)]
              except Exception:
                  pass
          try:
              ed = json.load(open('site/data/latest.json', encoding='utf-8')).get('edition') or {}
              wanted += [(it.get('image') or {}).get('src') for it in ed.get('items') or []]
          except Exception:
              pass
          ok = sum(1 for rel in wanted if isinstance(rel, str) and rel.startswith(('audio/items/', 'audio/politique/items/', 'img/')) and '..' not in rel and get(rel))
          print(f'{ok} fichiers repris sur {len([w for w in wanted if w])}.')
          PY

      - name: Numéro de version de l'appli (le même que la liste des nouveautés)
        run: python3 scripts/version_appli.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publication:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
