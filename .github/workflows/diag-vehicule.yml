# Diagnostic : données ouvertes pour « Mon véhicule » (prix des carburants, bornes de recharge). Lancé à la main.
name: Diagnostic véhicule
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-vehicule.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Essais
        continue-on-error: true
        run: |
          set +e
          mkdir -p keep; O="Origin: https://hadesdray-crypto.github.io"
          t(){ echo "== $1"; curl -sS -m 40 -D - -o "keep/$2" -H "$O" "$3" | grep -iE "^(HTTP|access-control-allow-origin|content-type)"; head -c 2500 "keep/$2"; echo; }
          {
          t "carburants bbox" carb.json "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?where=in_bbox(geom,49.0,1.1,49.25,1.2)&limit=3"
          t "carburants distance" carb2.json "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?where=within_distance(geom,geom'POINT(1.165%2049.216)',5km)&limit=2&select=id,adresse,ville,geom,gazole_prix,e10_prix,sp95_prix,sp98_prix,e85_prix,gplc_prix,gazole_maj"
          t "irve odre" irve.json "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/bornes-irve/records?limit=2"
          t "irve odre bbox" irve2.json "https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/bornes-irve/records?where=in_bbox(geo_point_borne,49.0,1.1,49.25,1.2)&limit=2"
          t "irve data.gouv tabulaire" irve3.json "https://tabular-api.data.gouv.fr/api/resources/eb76d20a-8501-400e-b336-d85724de5435/data/?page_size=2"
          } > keep/resultats.txt 2>&1
          echo "::notice title=Resultats::$(tr '\n' ' ' < keep/resultats.txt | head -c 9000)"
      - name: Écrire sur la branche diag
        if: always()
        run: |
          mkdir -p keep && cd keep && echo ok > .garde
          git init -q && git checkout -q -b diag
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q --allow-empty -m "Diagnostic véhicule"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
