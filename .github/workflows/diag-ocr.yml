# Diagnostic : lecture de la carte grise dans le téléphone (tesseract.js). Lancé à la main.
name: Diagnostic lecture photo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag-ocr.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Paquets
        continue-on-error: true
        run: |
          set +e
          mkdir -p keep/ocr w && cd w
          for p in tesseract.js@5.1.1 tesseract.js-core@5.1.1 @tesseract.js-data/fra@1.0.0; do
            d=$(echo "$p" | tr '/@' '__'); mkdir -p "$d"; (cd "$d" && npm pack "$p" -q >/dev/null 2>&1 && tar xzf *.tgz && echo "== $p" && find package -type f -printf "%s\t%p\n" | grep -v "\.map$\|\.d\.ts$" | sort -k2 | head -60) >> ../keep/paquets.txt 2>&1
          done
          cd ..
          T=w/tesseract.js_5.1.1/package; C=w/tesseract.js-core_5.1.1/package; F=w/_tesseract.js-data_fra_1.0.0/package
          cp $T/dist/tesseract.min.js $T/dist/worker.min.js keep/ocr/; cp $T/LICENSE.md keep/ocr/tesseract-LICENSE.md 2>/dev/null
          cp $C/tesseract-core-simd-lstm.wasm.js $C/tesseract-core-lstm.wasm.js keep/ocr/ 2>/dev/null; cp $C/tesseract-core-simd-lstm.wasm $C/tesseract-core-lstm.wasm keep/ocr/ 2>/dev/null
          cp $F/4.0.0_best_int/fra.traineddata.gz keep/ocr/ 2>/dev/null || cp $F/4.0.0/fra.traineddata.gz keep/ocr/ 2>/dev/null
          ls -la keep/ocr; echo "::notice title=OCR::$(ls -la keep/ocr | tr '\n' ' ')"; echo "::notice title=Paquets::$(tr '\n' ' ' < keep/paquets.txt | head -c 6000)"
      - name: Écrire sur la branche diag
        if: always()
        run: |
          mkdir -p keep && cd keep && echo ok > .garde
          git init -q && git checkout -q -b diag
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q --allow-empty -m "Diagnostic lecture photo"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
